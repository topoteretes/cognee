[project]
name = "cognee-mcp"
version = "0.5.6"
description = "Cognee MCP server"
readme = "README.md"
# Keep the tested Python range; document conversion uses the slim Docling extra.
requires-python = ">=3.10,<3.14"

dependencies = [
    # For local cognee repo usage remove comment below and add absolute path to cognee. Then run `uv sync --reinstall` in the mcp folder on local cognee changes.
    #"cognee[postgres-binary,docling,neo4j] @ file:/path/to/your/cognee",
    "cognee[postgres-binary,docling,neo4j]>=1.5.0,<2.0.0",
    # Older supported Cognee releases do not include OpenDocument in their slim extra.
    "docling-slim[format-opendocument]>=2.115,<3",
    # FastMCP 3 ships tag-based visibility and the tool-search transform this
    # server relies on; the FastMCP vendored in the `mcp` SDK is an older fork
    # that has neither. `mcp` is still a direct dependency for its wire types.
    "fastmcp>=3.4.0,<4.0.0",
    "mcp>=1.24.0,<2.0.0",
    "uv>=0.6.3,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

authors = [
    { name = "Boris Arzentar", email = "boris@topoteretes.com" },
    { name = "Igor Ilic", email = "igor@topoteretes.com" },
    { name = "Laszlo Hajdu", email = "laszlo@topoteretes.com" },
]

[build-system]
requires = [ "hatchling", ]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "debugpy>=1.8.12,<2.0.0",
    "pytest>=7.4.0,<9",
    "pytest-asyncio>=0.21.1,<2",
]

postgres-binary = [
    "psycopg2-binary>=2.9.10,<3.0.0",
    "pgvector>=0.3.5,<0.4",
    "asyncpg>=0.30.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Cognee's local FastEmbed embeddings require onnxruntime. Preserve the
# Python-version split for releases that predate the core dependency constraint.
# The >=3.14 arm is retained for a future expansion of the tested Python range.
constraint-dependencies = [
    "onnxruntime<=1.23.2 ; python_version < '3.14'",
    "onnxruntime>=1.24.1 ; python_version >= '3.14'",
]

# Note: exclude newer packages that are less than 2 days old
exclude-newer = "2 days"
# ...but never for cognee itself or its pinned Enola binary. Applying the window
# to cognee made release-day locks select an older release (issue #4360), while
# applying it to Enola prevents local cognee source installs until the pin is
# two days old even though the release is validated before the pin is updated.
exclude-newer-package = { cognee = "0 days", enola-cli = "0 days" }

[project.scripts]
cognee = "src:main"
cognee-mcp = "src:main_mcp"
