id: custom-ontology
title: Ground the knowledge graph in a custom ontology
kind: use-case
stack: use-case
tags:
  - ontology
  - owl
  - domain-vocabulary
  - entity-extraction
summary: Ground extracted entities in a domain ontology (OWL or similar) — matched entities are canonicalized and enriched with its class hierarchy; unmatched ones are kept, or dropped by ONTOLOGY_MODE=strict (graph-only; chunks stay searchable).
what_youll_build: A cognify run configured with a custom ontology file where matched entity names and types are canonicalized to the ontology's terms and enriched with its class hierarchy, and recall answers use the domain's terminology.
quickstart: |
  git clone https://github.com/topoteretes/cognee.git
  cd cognee
  uv pip install cognee
  export LLM_API_KEY=your_openai_key
  export ONTOLOGY_FILE_PATH=/path/to/your/domain.owl
  export MATCHING_STRATEGY=fuzzy
  python examples/guides/ontology_quickstart.py
expected_output: |
  A graph where node types and edge labels come from the ontology, plus a
  recall answer that uses the ontology's terms instead of ad-hoc LLM
  paraphrases.
difficulty: advanced
example_path: examples/guides/ontology_quickstart.py
