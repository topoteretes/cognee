# Slack app manifest for testing the *SDK* Slack integration locally.
#
# This is NOT the cloud manifest (cognee-saas-backend/slack-app-manifest.yml
# describes the control plane's app). It is the one manifest for the SDK:
# members talk to Cognee with @cognee in a channel the app is in or in a direct
# message to the app (handle_cognee_mention.py), and "Remember this" saves
# someone else's message. There are no slash commands.

# Create a SEPARATE Slack app for SDK testing — do not point the cloud app at
# your laptop. Reusing one app means whoever else is testing has their events
# routed to your ngrok tunnel.
#
# Replace <ngrok> with your tunnel host, e.g. abc123.ngrok-free.app
#
# Tunnel the UI, not the API: run the UI with COGNEE_DEV_API_PROXY=http://localhost:8000,
# `ngrok http 3000`, and open the UI at https://<ngrok>. The install cookie is set on the
# host the UI calls and checked on the host the callback arrives on; two hosts end in
# error_invalid_state. See Setup in cognee/tasks/ingestion/connectors/slack.md.
#
# ── First save will fail unless the server is already reachable ────────────
# Slack POSTs a url_verification challenge to request_url the moment you save
# event_subscriptions. Start the SDK server AND ngrok first, then create the
# app from this manifest.

display_information:
  name: Cognee SDK (local)
  description: Local SDK testing — not the production Cognee app.
  background_color: "#6510F4"

features:
  bot_user:
    display_name: cognee-sdk-local
    always_online: false
  # app_home_opened only fires when the Home tab is enabled. handle_slack_event
  # publishes the view via home.py::publish_home_view on that event.
  app_home:
    home_tab_enabled: true
    # The Messages tab is where a member sends a private question to the app.
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  shortcuts:
    # callback_id must be exactly remember_this — handle_slack_interactive
    # matches on REMEMBER_THIS_CALLBACK_ID.
    - name: Remember this
      type: message
      callback_id: remember_this
      description: Save this message to your memory
    # callback_id must be exactly forget_this (FORGET_THIS_CALLBACK_ID).
    - name: Forget this
      type: message
      callback_id: forget_this
      description: Forget your saved copy of this message

oauth_config:
  redirect_urls:
    # Must byte-match SLACK_REDIRECT_URI in your .env.
    - https://<ngrok>/api/v1/integrations/slack/callback
    # Sign in with Slack (a member links their own Cognee account); must byte-match
    # SLACK_MEMBER_REDIRECT_URI.
    - https://<ngrok>/api/v1/integrations/slack_member/callback
  scopes:
    bot:
      # Exactly _BOT_SCOPES in cognee/modules/integrations/slack/oauth.py.
      # Adding more here without changing that constant does nothing: the
      # authorize URL only requests what the constant lists.
      - app_mentions:read
      - chat:write
      # Message shortcuts (Remember this, Forget this) need it, slash commands or not.
      - commands
      - im:history
      - channels:read
      - channels:history
      - groups:read
      - groups:history
      - users:read

settings:
  event_subscriptions:
    request_url: https://<ngrok>/api/v1/slack/events
    bot_events:
      # The ones the SDK acts on. app_mention and message.im are @cognee in a
      # channel and in a direct message (app_mentions:read, im:history).
      # message.channels / message.groups send every message of every channel the
      # app is in to your tunnel; the handler reads only message_deleted and an
      # edited message_changed (to forget what "Remember this" saved) and acks the
      # rest. tests/unit/modules/integrations/test_slack_integration_routes.py pins
      # this list.
      - app_home_opened
      - app_mention
      - app_uninstalled
      - message.channels
      - message.groups
      - message.im
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://<ngrok>/api/v1/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
