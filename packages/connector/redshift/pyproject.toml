[project]
name = "cognee-community-connector-redshift"
version = "0.1.0"
description = "Amazon Redshift community data-source connector for Cognee"
authors = [{ name = "Cognee Community" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.34.0",
    "dlt>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "botocore>=1.34.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
