[project]
name = "cognee-community-connector-todoist"
version = "0.1.0"
description = "Todoist data-source connector for cognee — ingest Todoist projects and tasks into memory as structured markdown documents"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "cognee>=1.3.0",
    "httpx>=0.27.0,<1",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
