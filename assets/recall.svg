<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 488" role="img" aria-labelledby="title desc">
<title id="title">Recall context for the next agent task</title>
<desc id="desc">A new session asks what to check before a payments release. Document retrieval finds Alice and PostgreSQL; code search finds charge_once and replay_test; distilled session memory supplies the replay-test release rule. The application uses the retrieved context to continue the task.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#bc9bff"/></marker></defs>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#f5f1fc}
  .muted{fill:#c0b6d0}.label{font-size:13px;letter-spacing:1px;font-weight:700;fill:#bc9bff}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px;fill:#d4bdff}
  .flow{stroke:#bc9bff;stroke-width:2;stroke-dasharray:5 5;animation:flow 2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-20}}
  @media(prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect width="1120" height="488" rx="16" fill="#0c0b10"/>
<text x="36" y="51" font-size="30" font-weight="700">Start the next task with what you already know.</text>
<text x="36" y="80" font-size="17" class="muted">Retrieve relevant evidence from documents, code, and distilled session lessons.</text>
<rect x="36" y="105" width="1048" height="58" rx="10" fill="#241a33" stroke="#74519e"/>
<text x="56" y="140" font-size="19">“What should I check before releasing the payments API?”</text>
<text x="1064" y="140" text-anchor="end" class="mono">new session</text>
<g fill="none" marker-end="url(#arrow)">
  <path d="M201 169 V195" class="flow"/><path d="M559 169 V195" class="flow"/><path d="M917 169 V195" class="flow"/>
</g>
<g>
  <rect x="36" y="205" width="330" height="151" rx="10" fill="#191421" stroke="#413251"/>
  <text x="56" y="233" class="label">DOCUMENT CONTEXT</text>
  <text x="56" y="267" font-size="19" font-weight="700">Owner: Alice</text>
  <text x="56" y="295" font-size="17">Database: PostgreSQL</text>
  <text x="56" y="333" font-size="14" class="muted">Graph + vector retrieval</text>
  <rect x="394" y="205" width="330" height="151" rx="10" fill="#191421" stroke="#413251"/>
  <text x="414" y="233" class="label">CODE CONTEXT</text>
  <text x="414" y="267" font-size="19" font-weight="700">payments.py</text>
  <text x="414" y="296" class="mono">charge_once() · replay_test()</text>
  <text x="414" y="333" font-size="14" class="muted">Code graph queries</text>
  <rect x="752" y="205" width="332" height="151" rx="10" fill="#191421" stroke="#413251"/>
  <text x="772" y="233" class="label">LEARNED RULE</text>
  <text x="772" y="267" font-size="19" font-weight="700">Run the replay test first.</text>
  <text x="772" y="295" font-size="17">Guard against duplicate charges.</text>
  <text x="772" y="333" font-size="14" class="muted">Distilled into permanent memory</text>
</g>
<g fill="none" marker-end="url(#arrow)">
  <path d="M201 362 V389" class="flow"/><path d="M559 362 V389" class="flow"/><path d="M917 362 V389" class="flow"/>
</g>
<rect x="36" y="399" width="1048" height="57" rx="10" fill="#241a33" stroke="#74519e"/>
<text x="56" y="434" font-size="19" font-weight="700">Recall context → inspect the evidence → continue the task</text>
<text x="1064" y="434" text-anchor="end" class="mono">cognee.recall()</text>
</svg>
