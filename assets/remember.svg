<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 472" role="img" aria-labelledby="title desc">
<title id="title">Text, code, and session lessons become connected memory</title>
<desc id="desc">Documents produce entities and embeddings. Code produces symbols and dependencies. Session distillation curates accepted guidance into lasting lessons. All three paths build persistent Cognee memory.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bc9bff"/></marker>
</defs>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#f5f1fc}
  .muted{fill:#c0b6d0}.label{font-size:13px;letter-spacing:1px;font-weight:700;fill:#bc9bff}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;fill:#d4bdff}
  .flow{stroke:#bc9bff;stroke-width:2;stroke-dasharray:5 5;animation:flow 2s linear infinite}
  .pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes flow{to{stroke-dashoffset:-20}} @keyframes pulse{50%{stroke-width:5;stroke:#bc9bff}}
  @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style>
<rect width="1120" height="472" rx="16" fill="#0c0b10"/>
<text x="36" y="51" font-size="30" font-weight="700">Text. Code. Experience. One memory.</text>
<text x="36" y="80" font-size="17" class="muted">Keep the source context. Connect the facts. Carry useful lessons forward.</text>

<g>
  <rect x="36" y="112" width="302" height="84" rx="10" fill="#191421" stroke="#413251"/>
  <text x="54" y="137" class="label">01 / TEXT</text>
  <text x="54" y="162" font-size="17">Alice maintains the payments API.</text>
  <text x="54" y="183" font-size="15" class="muted">The API uses PostgreSQL.</text>
  <rect x="36" y="216" width="302" height="84" rx="10" fill="#191421" stroke="#413251"/>
  <text x="54" y="241" class="label">02 / CODE</text>
  <text x="54" y="266" font-size="17">payments.py</text>
  <text x="54" y="287" class="mono">replay_test() → charge_once()</text>
  <rect x="36" y="320" width="302" height="84" rx="10" fill="#191421" stroke="#413251"/>
  <text x="54" y="345" class="label">03 / SESSION</text>
  <text x="54" y="370" font-size="17">“Always run the replay test</text>
  <text x="54" y="391" font-size="17">before a payments release.”</text>
</g>
<g fill="none" marker-end="url(#arrow)">
  <path d="M350 154 H378" class="flow"/><path d="M350 258 H378" class="flow"/><path d="M350 362 H378" class="flow"/>
</g>
<g>
  <text x="396" y="145" class="mono">remember(text)</text>
  <text x="396" y="173" font-size="16" class="muted">Entities + relationships + embeddings</text>
  <text x="396" y="239" class="mono">remember(repo,</text>
  <text x="396" y="259" class="mono">  content_type="code")</text>
  <text x="396" y="285" font-size="16" class="muted">Code symbols + dependencies</text>
  <text x="396" y="353" class="mono">session.distill_session(...)</text>
  <text x="396" y="381" font-size="16" class="muted">Curate and publish accepted lessons</text>
</g>
<path d="M707 145 V365 M707 255 H745" fill="none" stroke="#655178" stroke-width="2"/>
<path d="M711 255 H745" fill="none" class="flow" marker-end="url(#arrow)"/>

<text x="921" y="127" font-size="13" class="label" text-anchor="middle">PERSISTENT MEMORY</text>
<g stroke="#715990" stroke-width="2" fill="none">
  <path d="M801 179 L921 258 L1040 179 M921 258 L801 357 M921 258 L1040 357"/>
</g>
<g font-size="12" class="muted">
  <text x="819" y="195" transform="rotate(33 819 195)">maintains</text>
  <text x="985" y="216" transform="rotate(-34 985 216)">uses</text>
  <text x="825" y="333" transform="rotate(-39 825 333)">implements</text>
  <text x="974" y="305" transform="rotate(40 974 305)">release rule</text>
</g>
<g fill="#bc9bff" stroke="#3d2c56" stroke-width="2">
  <circle cx="801" cy="179" r="12"/><circle cx="1040" cy="179" r="12"/>
  <circle cx="801" cy="357" r="12"/><circle cx="1040" cy="357" r="12"/>
  <rect x="850" y="237" width="142" height="42" rx="14" fill="#39264c" class="pulse"/>
</g>
<g font-size="16" font-weight="700" text-anchor="middle">
  <text x="801" y="155">Alice</text><text x="1040" y="155">PostgreSQL</text>
  <text x="921" y="264">Payments API</text>
  <text x="801" y="390">charge_once()</text><text x="1040" y="390">Replay test</text>
</g>
<text x="36" y="446" font-size="15" class="muted">Documents and lessons stay searchable. Code structure stays inspectable. Memory survives the session.</text>
</svg>
