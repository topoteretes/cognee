# cognee-connectors inventory: the catalog of every connector package this repository
# ships or plans, one entry per package under connectors/.
#
# scripts/validate_inventory.py checks this file against scripts/inventory.schema.json
# and against the connectors/ directories (every directory has an entry, every entry
# that is not "planned" has a directory); scripts/render_inventory.py renders the
# Connectors table of README.md from it; scripts/new_connector.py appends an entry
# when it scaffolds a package. Both checks run in .github/workflows/test_connectors.yml.
#
# Keep it in plain block YAML: one `- slug:` item per entry, nested keys indented by
# two spaces, short string lists inline (`[a, b]`), no anchors, no multi-line
# scalars. The scripts read it without PyYAML.
#
# Fields of an entry:
#   slug          the provider id: the directory name under connectors/ and the
#                 entry-point name (snake_case, e.g. google_drive)
#   package       the PyPI distribution name, cognee-connector-<provider> (dashes)
#   module        the import name, cognee_connector_<provider> (underscores)
#   directory     connectors/<slug>
#   display_name  the name shown in the README table and the connector catalog
#   auth          oauth2 | api_key | local
#   tier          1 (ConnectorDescriptor), 2 (descriptor plus parse_installation),
#                 3 (Connector subclass), or null for API-key and local providers
#   sources       the DLT source factories the package exports, by entry-point name
#                 (`<name>_source`); [] when the package ships none
#   hosts         cognee: plugs into a cognee server through cognee_host/
#                 cloud: consumed by cloud-backend
#   status        ported | planned | archived
#   origin        where the code came from: cognee: the path in cognee dev (or null),
#                 cloud: the path in cloud-backend (or null)
#   env_vars      every environment variable the package's settings read; the names
#                 are unchanged from cognee
connectors:
  - slug: linear
    package: cognee-connector-linear
    module: cognee_connector_linear
    directory: connectors/linear
    display_name: "Linear"
    auth: oauth2
    tier: 2
    sources: [linear]
    hosts:
      cognee: true
      cloud: false
    status: ported
    origin:
      cognee: "cognee/modules/integrations/linear, cognee/tasks/ingestion/connectors/linear.py"
      cloud: null
    env_vars: [LINEAR_CLIENT_ID, LINEAR_CLIENT_SECRET, LINEAR_REDIRECT_URI, LINEAR_FRONTEND_BASE_URL, LINEAR_WEBHOOK_SECRET, LINEAR_RESUME_SYNC_ENABLED, LINEAR_RESUME_INTERVAL_SECONDS]
  - slug: google
    package: cognee-connector-google
    module: cognee_connector_google
    directory: connectors/google
    display_name: "Google"
    auth: oauth2
    tier: 2
    sources: []
    hosts:
      cognee: false
      cloud: false
    status: ported
    origin:
      cognee: "cognee/modules/integrations/google"
      cloud: "modules/integrations/google"
    env_vars: []
