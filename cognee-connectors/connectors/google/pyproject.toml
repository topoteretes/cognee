[build-system]
# Pinned together with cognee's: the build backend decides the wheel's
# Metadata-Version, and the PyPI publish action validates it with a pinned
# twine. Bump this together with the release workflow's publish-action pin.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cognee-connector-google"
version = "0.1.0"
description = "The Google OAuth client, settings base and connector contract shared by cognee's Google Drive, Gmail and Google Calendar connectors"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognee team" }]
keywords = ["cognee", "ai-memory", "connector", "google", "oauth2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # No [dlt] extra: this package ships no DLT source; the three service packages
    # that do depend on cognee-connectors-core[dlt] themselves.
    "cognee-connectors-core>=0.1,<1",
    # The provider's own libraries, with the ranges cognee's pyproject.toml uses:
    # aiohttp for the OAuth and OpenID Connect client, pydantic-settings for the
    # settings base the GOOGLE_<PRODUCT>_* settings classes subclass.
    "aiohttp>=3.13.5,<4.0.0",
    "pydantic-settings>=2.7.0,!=2.12.*,!=2.13.*,!=2.14.0,!=2.14.1,<3",
]

[project.optional-dependencies]
# The cognee_host/ subpackage (the GoogleOAuthIntegration base the service adapters
# subclass) needs cognee; nothing else in the package does.
cognee = ["cognee>=1.6.5,<2"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee/tree/main/cognee-connectors/connectors/google"
Repository = "https://github.com/topoteretes/cognee"
Issues = "https://github.com/topoteretes/cognee/issues"
Documentation = "https://docs.cognee.ai"

[project.entry-points."cognee.connectors"]
# The identity-only base connector (connects a Google account, syncs nothing); the
# service packages advertise google_drive, gmail and google_calendar.
google = "cognee_connector_google:CONNECTOR"

# No "cognee.sources" entry point: this package ships no DLT source.
# No "cognee.integrations" entry point: Google itself is not a provider in cognee's
# registry; each service package registers its own adapter (cognee_host/__init__.py).

[tool.hatch.build.targets.wheel]
packages = ["cognee_connector_google"]

[tool.hatch.build.targets.sdist]
include = ["cognee_connector_google", "tests", "README.md", "LICENSE", "pyproject.toml"]
