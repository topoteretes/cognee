[build-system]
# Pinned together with cognee's: the build backend decides the wheel's
# Metadata-Version, and the PyPI publish action validates it with a pinned
# twine. Bump this together with the release workflow's publish-action pin.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cognee-connector-google-drive"
version = "0.1.0"
description = "Google Drive connector for cognee: syncs a Drive folder's Docs, Sheets, PDFs and text files into cognee memory, incrementally and with forget-on-delete"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognee team" }]
keywords = ["cognee", "ai-memory", "connector", "google-drive", "google"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cognee-connectors-core[dlt]>=0.1,<1",
    # The shared Google OAuth client, settings base and connector contract.
    "cognee-connector-google>=0.1,<1",
    # The provider's own libraries, with the ranges cognee's pyproject.toml uses
    # (its google-drive extra): the Drive API client and the two auth libraries the
    # source builds its clients from, pypdf for PDFs (a core dependency of cognee),
    # aiohttp for the REST client the picker uses, pydantic-settings for the
    # GOOGLE_DRIVE_* settings class.
    "google-api-python-client>=2.100.0,<3",
    "google-auth>=2.23.0,<3",
    "google-auth-oauthlib>=1.1.0,<2",
    "pypdf>=6.6.2,<7.0.0",
    "aiohttp>=3.13.5,<4.0.0",
    "pydantic-settings>=2.7.0,!=2.12.*,!=2.13.*,!=2.14.0,!=2.14.1,<3",
]

[project.optional-dependencies]
# The cognee_host/ adapter needs cognee, and so does reading Office and document
# files from Drive (they go through cognee's loader engine); nothing else in the
# package does. A sync needs a cognee whose ingestion scopes DLT document cleanup by
# table (DOCUMENT_SYNC_VERSION 1); an older host is refused with a clear message when
# the source is built, not at install time.
cognee = ["cognee>=1.6.5,<2"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee/tree/main/cognee-connectors/connectors/google-drive"
Repository = "https://github.com/topoteretes/cognee"
Issues = "https://github.com/topoteretes/cognee/issues"
Documentation = "https://docs.cognee.ai"

[project.entry-points."cognee.connectors"]
google_drive = "cognee_connector_google_drive:CONNECTOR"

[project.entry-points."cognee.sources"]
google_drive = "cognee_connector_google_drive:google_drive_source"

[project.entry-points."cognee.integrations"]
google_drive = "cognee_connector_google_drive.cognee_host:register"

[tool.hatch.build.targets.wheel]
packages = ["cognee_connector_google_drive"]

[tool.hatch.build.targets.sdist]
include = ["cognee_connector_google_drive", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]
