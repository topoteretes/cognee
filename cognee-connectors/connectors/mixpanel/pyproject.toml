[build-system]
# Pinned together with cognee's: the build backend decides the wheel's
# Metadata-Version, and the PyPI publish action validates it with a pinned
# twine. Bump this together with the release workflow's publish-action pin.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cognee-connector-mixpanel"
version = "0.1.0"
description = "Mixpanel connector for cognee: syncs a project's analytics definitions into cognee memory, incrementally and with forget-on-delete"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognee team" }]
keywords = ["cognee", "ai-memory", "connector", "mixpanel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cognee-connectors-core[dlt]>=0.2,<1",
    # The REST client calls requests itself (lazily, on the first request). cognee pins
    # no range of its own for it; this is dlt's floor, which cognee-connectors-core[dlt]
    # pulls in anyway, capped below the next major.
    "requests>=2.26.0,<3",
]

[project.optional-dependencies]
# Nothing in the package needs cognee: cognee_host/register() has nothing to
# register (see cognee_connector_mixpanel/cognee_host/__init__.py). The extra exists
# so hosts install the package the same way for every provider.
cognee = ["cognee>=1.6.5,<2"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee/tree/main/cognee-connectors/connectors/mixpanel"
Repository = "https://github.com/topoteretes/cognee"
Issues = "https://github.com/topoteretes/cognee/issues"
Documentation = "https://docs.cognee.ai"

[project.entry-points."cognee.connectors"]
mixpanel = "cognee_connector_mixpanel:CONNECTOR"

[project.entry-points."cognee.sources"]
mixpanel = "cognee_connector_mixpanel:mixpanel_source"

# No "cognee.integrations" entry point: Mixpanel has no OAuth flow and no host adapter in
# cognee, so a cognee server has nothing to register for it (cognee_host/__init__.py).

[tool.uv]
# Note: exclude newer packages that are less than 2 days old, as cognee's own
# pyproject does. Inside the cognee-connectors workspace uv reads only the
# workspace root's settings, which carry the same lines; this copy applies when
# the package is checked out and resolved on its own.
exclude-newer = "2 days"
# ...but never for cognee itself (or enola-cli, which cognee pins exactly): the
# window otherwise resolves a release-day cognee to the previous release, as in
# cognee-mcp (issue #4360).
exclude-newer-package = { cognee = "0 days", enola-cli = "0 days" }

[tool.hatch.build.targets.wheel]
packages = ["cognee_connector_mixpanel"]

[tool.hatch.build.targets.sdist]
include = ["cognee_connector_mixpanel", "tests", "README.md", "LICENSE", "pyproject.toml"]
