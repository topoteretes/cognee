[build-system]
# Pinned together with cognee's: the build backend decides the wheel's
# Metadata-Version, and the PyPI publish action validates it with a pinned
# twine. Bump this together with the release workflow's publish-action pin.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cognee-connector-asana"
version = "0.1.0"
description = "Asana connector for cognee: syncs the tasks and projects you select into cognee memory, incrementally and with forget-on-delete"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognee team" }]
keywords = ["cognee", "ai-memory", "connector", "asana"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cognee-connectors-core[dlt]>=0.1,<1",
    # The REST client calls requests itself (lazily, on the first request). cognee pins
    # no range of its own for it; this is dlt's floor, which cognee-connectors-core[dlt]
    # pulls in anyway, capped below the next major.
    "requests>=2.26.0,<3",
]

[project.optional-dependencies]
# The integration tests run the sync through cognee. Nothing in the package needs it:
# cognee_host/register() has nothing to register (see cognee_host/__init__.py).
cognee = ["cognee>=1.6.5,<2"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee/tree/main/cognee-connectors/connectors/asana"
Repository = "https://github.com/topoteretes/cognee"
Issues = "https://github.com/topoteretes/cognee/issues"
Documentation = "https://docs.cognee.ai"

[project.entry-points."cognee.connectors"]
asana = "cognee_connector_asana:CONNECTOR"

[project.entry-points."cognee.sources"]
asana = "cognee_connector_asana:asana_source"

# No "cognee.integrations" entry point: Asana has no OAuth flow and no host adapter in
# cognee, so a cognee server has nothing to register for it (cognee_host/__init__.py).

[tool.hatch.build.targets.wheel]
packages = ["cognee_connector_asana"]

[tool.hatch.build.targets.sdist]
include = ["cognee_connector_asana", "tests", "README.md", "LICENSE", "pyproject.toml"]
