[build-system]
# Pinned together with cognee's: the build backend decides the wheel's
# Metadata-Version, and the PyPI publish action validates it with a pinned
# twine. Bump this together with the release workflow's publish-action pin.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cognee-connector-slack"
version = "0.2.0"
description = "Slack connector for cognee: syncs selected Slack channels into cognee memory, incrementally and with forget-on-delete, plus the @cognee Slack app for a cognee server"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognee team" }]
keywords = ["cognee", "ai-memory", "connector", "slack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cognee-connectors-core[dlt]>=0.2,<1",
    # The provider's own libraries, with the ranges cognee's pyproject.toml uses:
    # httpx for the DLT source's Web API client, pydantic-settings for the SLACK_*
    # settings class. aiohttp is used by cognee_host/ only and comes with cognee.
    "httpx>=0.28.1",
    "pydantic-settings>=2.7.0,!=2.12.*,!=2.13.*,!=2.14.0,!=2.14.1,<3",
]

[project.optional-dependencies]
# The cognee_host/ adapter (the @cognee app, its routes, the channel sync and Sign in
# with Slack) needs cognee; nothing else in the package does. It uses the integration
# APIs of SDK-1497..1502 (``revoked_by`` on credentials, ``refuse_parent``,
# ``outbound.client_session``, sync policies, the ``slack`` entry of
# ``integrations.ingestion``), none of which cognee 1.6.7 has. 1.6.8 is the first
# release that carries them.
cognee = ["cognee>=1.6.8,<2"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee/tree/main/cognee-connectors/connectors/slack"
Repository = "https://github.com/topoteretes/cognee"
Issues = "https://github.com/topoteretes/cognee/issues"
Documentation = "https://docs.cognee.ai"

[project.entry-points."cognee.connectors"]
slack = "cognee_connector_slack:CONNECTOR"

[project.entry-points."cognee.sources"]
slack = "cognee_connector_slack:slack_source"

[project.entry-points."cognee.integrations"]
slack = "cognee_connector_slack.cognee_host:register"

[tool.uv]
# Note: exclude newer packages that are less than 2 days old, as cognee's own
# pyproject does. Inside the cognee-connectors workspace uv reads only the
# workspace root's settings, which carry the same lines; this copy applies when
# the package is checked out and resolved on its own.
exclude-newer = "2 days"
# ...but never for cognee itself (or enola-cli, which cognee pins exactly): the
# window otherwise resolves a release-day cognee to the previous release, as in
# cognee-mcp (issue #4360).
exclude-newer-package = { cognee = "0 days", enola-cli = "0 days" }

[tool.hatch.build.targets.wheel]
packages = ["cognee_connector_slack"]

[tool.hatch.build.targets.sdist]
include = ["cognee_connector_slack", "tests", "README.md", "LICENSE", "pyproject.toml", "manifest.yml"]
