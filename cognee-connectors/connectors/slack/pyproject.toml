[build-system]
# Pinned together with cognee's: the build backend decides the wheel's
# Metadata-Version, and the PyPI publish action validates it with a pinned
# twine. Bump this together with the release workflow's publish-action pin.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cognee-connector-slack"
version = "0.1.0"
description = "Slack connector for cognee: the Slack app (slash commands, Remember this, App Home) and channel-history import into cognee memory, plus the provider's connection contract"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognee team" }]
keywords = ["cognee", "ai-memory", "connector", "slack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # No [dlt] extra: Slack ships no DLT source, its history import is its own flow.
    "cognee-connectors-core>=0.1,<1",
    # The provider's own libraries, with the ranges cognee's pyproject uses.
    "aiohttp>=3.13.5,<4.0.0",
    "pydantic>=2.13",
]

[project.optional-dependencies]
# The cognee_host/ adapter (the Slack app's handlers and routes, the history
# import) needs cognee; nothing else in the package does. The history import
# reports progress through cognee.modules.integrations.sync_progress when the
# installed cognee has it (newer than 1.6.6) and runs without reports otherwise
# (cognee_host/compat.py; README.md, "Requirements").
cognee = ["cognee>=1.6.5,<2"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee/tree/main/cognee-connectors/connectors/slack"
Repository = "https://github.com/topoteretes/cognee"
Issues = "https://github.com/topoteretes/cognee/issues"
Documentation = "https://docs.cognee.ai"

[project.entry-points."cognee.connectors"]
slack = "cognee_connector_slack:CONNECTOR"

# No "cognee.sources" entry point: Slack has no DLT source (docs/ARCHITECTURE.md,
# rule 6 lists one per DLT source).

[project.entry-points."cognee.integrations"]
slack = "cognee_connector_slack.cognee_host:register"

[tool.hatch.build.targets.wheel]
packages = ["cognee_connector_slack"]

[tool.hatch.build.targets.sdist]
include = ["cognee_connector_slack", "tests", "README.md", "LICENSE", "pyproject.toml"]
