[build-system]
# Pinned together with cognee's: the build backend decides the wheel's
# Metadata-Version, and the PyPI publish action validates it with a pinned
# twine. Bump this together with the release workflow's publish-action pin.
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "cognee-connector-obsidian"
version = "0.1.0"
description = "Obsidian connector for cognee: syncs the notes of a local vault into cognee memory, incrementally and with forget-on-delete"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cognee team" }]
keywords = ["cognee", "ai-memory", "connector", "obsidian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cognee-connectors-core[dlt]>=0.1,<1",
    # A note's frontmatter (its title and tags) is parsed with PyYAML, imported when a note
    # is read. cognee pins no range of its own for it; this is dlt's floor, which
    # cognee-connectors-core[dlt] pulls in anyway, capped below the next major.
    "PyYAML>=5.4.1,<7",
]

[project.optional-dependencies]
# The integration tests run the sync through cognee. Nothing in the package needs it:
# cognee_host/register() has nothing to register (see cognee_host/__init__.py). A sync
# needs a cognee whose ingestion reads per-row node sets and structure
# (DOCUMENT_SYNC_VERSION 3, cognee 1.6.6rc1); an older host is refused with a clear
# message when the source is built, not at install time.
cognee = ["cognee>=1.6.5,<2"]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee/tree/main/cognee-connectors/connectors/obsidian"
Repository = "https://github.com/topoteretes/cognee"
Issues = "https://github.com/topoteretes/cognee/issues"
Documentation = "https://docs.cognee.ai"

[project.entry-points."cognee.connectors"]
obsidian = "cognee_connector_obsidian:CONNECTOR"

[project.entry-points."cognee.sources"]
obsidian = "cognee_connector_obsidian:obsidian_source"

# No "cognee.integrations" entry point: Obsidian has no OAuth flow and no host adapter in
# cognee (a vault is a local folder), so a cognee server has nothing to register for it
# (cognee_host/__init__.py).

[tool.hatch.build.targets.wheel]
packages = ["cognee_connector_obsidian"]

[tool.hatch.build.targets.sdist]
include = ["cognee_connector_obsidian", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]
