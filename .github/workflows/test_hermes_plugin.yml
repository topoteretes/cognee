name: test | hermes plugin
# Checks for the Hermes Agent memory plugin under cognee-integrations/integrations/hermes-agent:
# lint, the lockfile, and the plugin's own test suite. The suite also reads the
# shared case tables in cognee-integrations/integrations/conformance/.
#
# The plugin declares no cognee dependency (cognee's pins conflict with the
# environment Hermes shares between plugins), so its tests that start a local
# server get cognee from local-mode-requirements.txt, the release local mode
# installs. That is a PyPI release, not this checkout: the plugin talks to a
# cognee server over HTTP and is released on its own schedule.
#
# The live round trip against a real LLM (tests/test_integration_*.py) skips
# here; it needs COGNEE_RUN_INTEGRATION=1 and an LLM key.

on:
  push:
    branches: [ main, dev ]
    paths: &paths
      - "cognee-integrations/integrations/hermes-agent/**"
      - "cognee-integrations/integrations/conformance/**"
      - "cognee-integrations/pyproject.toml"
      - ".github/workflows/test_hermes_plugin.yml"
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize, reopened]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, never a push-to-dev run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TELEMETRY_DISABLED: "1"

defaults:
  run:
    working-directory: cognee-integrations/integrations/hermes-agent

jobs:
  hermes-plugin-tests:
    name: hermes plugin tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        # The version in .python-version, which uv reads from the working directory.
        run: uv python install

      - name: Validate uv lockfile
        # Before the sync on purpose: `uv sync` refreshes a stale lock in the
        # runner's checkout, and a check after it would pass against what it
        # had just written.
        run: uv lock --check || { echo "'uv lock --check' failed. Run 'uv lock' in cognee-integrations/integrations/hermes-agent/ and push your changes."; exit 1; }

      - name: Install the plugin and its dev tools
        run: uv sync --locked --dev

      - name: Install the local-mode cognee release
        run: uv pip install -r local-mode-requirements.txt

      - name: Ruff check
        if: ${{ !cancelled() }}
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        if: ${{ !cancelled() }}
        run: uv run --no-sync ruff format --check .

      - name: Run the test suite
        if: ${{ !cancelled() }}
        # --no-sync: a re-sync to uv.lock would remove the cognee installed above.
        run: uv run --no-sync pytest tests/ -v
