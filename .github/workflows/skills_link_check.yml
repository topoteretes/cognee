name: Skills link check

# .agents/skills holds the repo's skills (Codex reads it natively) and
# .claude/skills is a git symlink to it. On a default Windows clone git writes
# that symlink as a text file; the SessionStart hook in .claude/settings.json
# replaces it with a junction. This workflow proves both paths work.
#
# Everything here is deterministic and secret-free, so it also runs on fork
# PRs. Checking discovery by asking a live Claude session to list its skills
# needs ANTHROPIC_API_KEY, which forks never get, and grades the result with a
# substring match on model prose — a check that fails for contributors and
# flakes for everyone. Reading the files through .claude/skills tests the one
# thing this layout can actually break.

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".claude/**"
      - ".github/workflows/skills_link_check.yml"

permissions:
  contents: read

jobs:
  windows-junction:
    name: Windows junction fallback
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable symlinks like a default Git for Windows install
        run: git config --global core.symlinks false

      - name: Check out (into a path with a space)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: repo with space

      - name: Placeholder is a text file before the hook runs
        working-directory: repo with space
        run: |
          test -f .claude/skills && ! test -d .claude/skills
          echo "placeholder contents: $(cat .claude/skills)"

      - name: Hook creates the junction and requests a skill reload
        working-directory: repo with space
        run: |
          out="$(CLAUDE_PROJECT_DIR="$PWD" bash .claude/hooks/link-skills.sh)"
          echo "hook output: $out"
          echo "$out" | grep -q '"reloadSkills":true'
          test -f .claude/skills/cognee-cli/SKILL.md
          cmd //c dir .claude | grep -i "<JUNCTION>"

      - name: Git status stays clean, and `git add -A` adds nothing
        working-directory: repo with space
        run: |
          status="$(git status --porcelain -uall)"
          echo "$status"
          test -z "$status"
          git add -A
          staged="$(git diff --cached --name-only)"
          echo "$staged"
          test -z "$staged"

      - name: Second run is a no-op
        working-directory: repo with space
        run: test -z "$(CLAUDE_PROJECT_DIR="$PWD" bash .claude/hooks/link-skills.sh)"

      - name: A dangling junction is rebuilt, not abandoned
        working-directory: repo with space
        run: |
          # A moved checkout leaves a junction pointing at its old absolute path:
          # the entry still exists but resolves to nothing. Reproduce that.

          # Scaffolding, so clear the live junction with Windows' own rmdir
          # rather than whichever primitive the hook relies on — a broken setup
          # must not read as a hook failure.
          cmd //c rmdir '.claude\skills'

          # New-Item refuses a target that does not exist, so aim the junction at
          # a real directory and delete that directory afterwards. (`mklink /J`
          # would take a missing target, but needs MSYS_NO_PATHCONV to survive
          # Git Bash, which then breaks the `//c` that gets it to cmd.)
          mkdir -p .agents/tmp-junction-target
          SKILLS_LINK="$(cygpath -w "$PWD/.claude/skills")" \
          SKILLS_TARGET="$(cygpath -w "$PWD/.agents/tmp-junction-target")" \
            powershell.exe -NoProfile -NonInteractive -Command \
            'New-Item -ItemType Junction -Path $env:SKILLS_LINK -Target $env:SKILLS_TARGET | Out-Null'
          rmdir .agents/tmp-junction-target
          test ! -d .claude/skills

          out="$(CLAUDE_PROJECT_DIR="$PWD" bash .claude/hooks/link-skills.sh)"
          echo "hook output: $out"
          echo "$out" | grep -q '"reloadSkills":true'
          test -f .claude/skills/cognee-cli/SKILL.md
          # The relink must never have followed the old junction into the target.
          test -f .agents/skills/cognee-cli/SKILL.md

  skills-resolve:
    name: Skills resolve through .claude/skills (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run the SessionStart hook
        run: CLAUDE_PROJECT_DIR="$PWD" bash .claude/hooks/link-skills.sh

      - name: Every skill is readable through .claude/skills
        run: |
          shopt -s nullglob
          found=0
          failed=0
          for dir in .agents/skills/*/; do
            name="$(basename "$dir")"
            found=$((found + 1))
            linked=".claude/skills/$name/SKILL.md"
            if [ ! -f "$linked" ]; then
              echo "::error::$linked is not readable"
              failed=1
              continue
            fi
            # Same bytes, not a stale second copy someone committed by hand.
            if ! cmp -s "$dir/SKILL.md" "$linked"; then
              echo "::error::$linked differs from $dir/SKILL.md"
              failed=1
            fi
            # Agents match on the frontmatter name; a mismatch makes the skill
            # undiscoverable under the directory it lives in.
            declared="$(sed -n 's/^name: *//p' "$linked" | head -1)"
            if [ "$declared" != "$name" ]; then
              echo "::error::$linked declares name '$declared', expected '$name'"
              failed=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no skills found under .agents/skills"
            exit 1
          fi
          echo "checked $found skill(s)"
          exit $failed
