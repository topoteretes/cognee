name: Weekly ticket proposals

# Once a week: read the docs-assistant pain from MotherDuck, root-cause it
# against this codebase with Claude Code, and open a GitHub issue with
# proposed tickets. Runs two variants so we can compare their output:
#   A. baseline        — plain Claude Code over the checkout
#   B. cognee-assisted — Claude Code with the cognee memory plugin, after
#                        indexing this repo into cognee's code graph
#
# Each variant writes a full report (run artifact) and a short issue file:
# two tables with the same rows, one in plain words and one with the
# file:line evidence. The workflow, not the model, files the issue: a guard
# (scripts/weekly_tickets/issue_body.py) checks each issue file's shape, caps
# its length, and the publish job posts the two shaped sections.
#
# Required secrets: MOTHERDUCK_TOKEN, ANTHROPIC_API_KEY, LLM_API_KEY
# Optional secrets: LINEAR_API_KEY (dedup against open tickets)

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install duckdb
      - name: Test the issue-body guard
        run: python cognee/tests/unit/test_weekly_tickets_issue_body.py
      - name: Build weekly digest from MotherDuck
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: python scripts/weekly_tickets/fetch_context.py
      - uses: actions/upload-artifact@v7
        with:
          name: digest
          path: digest.md

  baseline:
    name: "Variant A: baseline (no cognee plugin)"
    needs: digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: digest
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Analyze and propose tickets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat scripts/weekly_tickets/prompt.md)" \
            --dangerously-skip-permissions \
            --output-format text
      - name: Shape issue section (tables, length cap)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mv proposals-report.md report-baseline.md
          if [ -f proposals-issue.md ]; then
            python3 scripts/weekly_tickets/issue_body.py proposals-issue.md issue-baseline.md
          else
            echo "_No proposals this week; see the run report._" > issue-baseline.md
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: proposals-baseline
          path: |
            report-baseline.md
            issue-baseline.md

  cognee-assisted:
    name: "Variant B: cognee plugin + indexed codebase"
    needs: digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: digest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Claude Code and cognee
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install cognee cognee-cli
      - name: Install the cognee memory plugin
        # Adjust the marketplace/plugin name if it differs in your setup.
        run: |
          claude plugin marketplace add topoteretes/cognee-integrations
          claude plugin install cognee-memory@cognee-integrations
      - name: Index this repository into cognee's code graph
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          cognee-cli index-code . || cognee-cli remember --content-type code .
      - name: Analyze and propose tickets (cognee-assisted)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          {
            cat scripts/weekly_tickets/prompt.md
            echo
            echo "## Additional instruction for this run"
            echo "The cognee memory plugin is installed and this repository is"
            echo "indexed in cognee's code graph. Prefer cognee search"
            echo "(cognee-code / cognee-search skills) for structural questions:"
            echo "callers, impact analysis, where an exception class is raised"
            echo "and consumed. Fall back to grep only when the graph has no"
            echo "answer."
          } > /tmp/prompt-cognee.md
          claude -p "$(cat /tmp/prompt-cognee.md)" \
            --dangerously-skip-permissions \
            --output-format text
      - name: Shape issue section (tables, length cap)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mv proposals-report.md report-cognee.md
          if [ -f proposals-issue.md ]; then
            python scripts/weekly_tickets/issue_body.py proposals-issue.md issue-cognee.md
          else
            echo "_No proposals this week; see the run report._" > issue-cognee.md
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: proposals-cognee
          path: |
            report-cognee.md
            issue-cognee.md

  publish:
    needs: [baseline, cognee-assisted]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Open comparison issue (only step that writes to GitHub)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "Ticket proposals from last week's docs-assistant conversations, one section"
            echo "per analysis variant. Each row is one proposed ticket: plain words first,"
            echo "then the evidence. Full reports and the digest are in the run artifacts."
            echo
            echo "# Variant A — baseline Claude Code"
            echo
            cat issue-baseline.md
            echo
            echo "---"
            echo
            echo "# Variant B — Claude Code + cognee memory plugin (indexed codebase)"
            echo
            cat issue-cognee.md
          } > issue-body.md
          gh issue create \
            --title "Weekly ticket proposals — $(date -u +%Y-%m-%d)" \
            --label "ticket-proposals" \
            --body-file issue-body.md
