on:
  workflow_call:

permissions:
  contents: read

env:
  COGNEE_SKIP_CONNECTION_TEST: 'true'

jobs:
  check-uv-lock:
    name: Lockfile and Pre-commit Hooks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Validate uv lockfile and project metadata
        run: uv lock --check || { echo "'uv lock --check' failed."; echo "Run 'uv lock' and push your changes."; exit 1; }

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  # Fails when a dependency's license would extend to cognee's Apache-2.0 code:
  # strong copyleft (GPL, AGPL) in a package cognee imports or a native library
  # it vendors. Installs every extra, so optional dependencies are covered too.
  # The result depends only on the resolved dependencies, so the install and
  # scan run only when they (or the check itself) change. With no base to
  # compare against (workflow_dispatch, a new branch), it always runs.
  license-compatibility:
    name: License Compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Detect dependency changes
        id: deps
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git diff --quiet "$BASE" HEAD -- uv.lock pyproject.toml scripts/check_license_compatibility.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies unchanged; skipping the license check."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.deps.outputs.changed == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true

      - name: Install every extra on Python 3.13
        if: steps.deps.outputs.changed == 'true'
        run: uv sync --locked --all-extras --no-install-project --python 3.13

      - name: Check dependency licenses against Apache-2.0
        if: steps.deps.outputs.changed == 'true'
        run: uv run --no-sync python scripts/check_license_compatibility.py
