name: Dev Canary Release

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: dev-canary-release
  cancel-in-progress: true

# Minimal default permissions (OSSF Scorecard: Token-Permissions).
# The nested basic-tests workflow requires package read access; publishing jobs
# opt into their additional write scopes explicitly.
permissions:
  contents: read
  packages: read

jobs:
  # ── Gate: run core test suites before publishing ────────────────────
  test-gate:
    name: Canary Test Gate
    uses: ./.github/workflows/basic_tests.yml
    with:
      ci-image: ""
    secrets: inherit

  # ── Compute canary version ──────────────────────────────────────────
  prepare:
    name: Prepare Canary Version
    runs-on: ubuntu-latest
    needs: test-gate
    outputs:
      version: ${{ steps.version.outputs.version }}
      canary_version: ${{ steps.version.outputs.canary_version }}
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install Python
        run: uv python install

      - name: Compute canary version
        id: version
        run: |
          BASE_VERSION="$(uv version --short)"
          # Strip any existing .devN suffix to get the base
          CLEAN_VERSION="${BASE_VERSION%%\.dev*}"
          # PEP 440 dev release: 0.5.4.dev20260309
          CANARY_VERSION="${CLEAN_VERSION}.dev$(date -u +%Y%m%d)"
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "canary_version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Canary version: ${CANARY_VERSION}"

  # ── Publish to PyPI ─────────────────────────────────────────────────
  release-pypi:
    name: Publish Dev Canary to PyPI
    needs: prepare
    # Publishing via PyPI Trusted Publishing (OIDC) so dev canaries also carry
    # verifiable PEP 740 provenance + a SLSA build-provenance attestation.
    # See docs/supply_chain_provenance.md for the one-time PyPI setup.
    permissions:
      contents: read
      id-token: write       # OIDC: Trusted Publishing + signing attestations
      attestations: write   # Persist the SLSA build provenance attestation
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install Python
        run: uv python install

      - name: Set canary version in pyproject.toml
        run: uv version "${{ needs.prepare.outputs.canary_version }}"

      - name: Install dependencies
        run: uv sync --all-extras

      # Bundle the official Ladybug JSON extension binaries into the wheel so
      # installs never download them from extension.ladybugdb.com at runtime.
      # Versions are derived from the ladybug constraint in pyproject.toml —
      # the source of truth (see cognee_db_workers/ladybug_extensions/README.md).
      - name: Fetch Ladybug JSON extension binaries
        run: ./scripts/fetch_ladybug_json_extension.sh

      - name: Build distributions
        run: uv build

      # A wheel without the binaries would still pass every test (the loader
      # falls back to the remote repo), so assert their presence explicitly:
      # every version dir the fetch produced must be inside the wheel.
      - name: Verify bundled extensions in wheel
        run: |
          versions=$(ls cognee_db_workers/ladybug_extensions | grep '^v' || true)
          test -n "$versions" || { echo "fetch produced no extension versions"; exit 1; }
          for version in $versions; do
            unzip -l dist/*.whl | grep -q "ladybug_extensions/$version/linux_amd64/libjson.lbug_extension" \
              || { echo "wheel is missing bundled extension $version"; exit 1; }
          done

      - name: Attest build provenance for distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        # Trusted Publishing (OIDC) — no API token. PEP 740 attestations are
        # generated and uploaded by default (attestations: true).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2 (twine 7.0.0: accepts Metadata-Version 2.5)
        with:
          packages-dir: dist/

  # ── Publish Docker image ────────────────────────────────────────────
  release-docker:
    name: Publish Dev Canary Docker Image
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Attach SLSA build provenance + SBOM in-toto attestations to the image.
          provenance: mode=max
          sbom: true
          tags: |
            cognee/cognee:dev-canary
            cognee/cognee:${{ needs.prepare.outputs.canary_version }}
          labels: |
            version=${{ needs.prepare.outputs.canary_version }}
            flavour=dev-canary
          cache-from: type=registry,ref=cognee/cognee:buildcache
          cache-to: type=registry,ref=cognee/cognee:buildcache,mode=max
