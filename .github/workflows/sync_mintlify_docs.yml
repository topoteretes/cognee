name: automation | Sync Mintlify Docs

on:
  pull_request:
  # Kept for a release a human publishes through the UI, which does fire this.
  release:
    types: [published]
  workflow_dispatch:
  # release.yml calls this directly, because the release event cannot be
  # relied on. release.yml creates AND publishes the release itself, and
  # GitHub deliberately does not fire `release: published` for an event
  # created with the default Actions token — so no release-triggered run has
  # happened since v1.0.4 (2026-05-03) and the published spec went stale
  # without anything failing. Being called removes the token from the path.
  workflow_call:
    inputs:
      tag:
        description: >-
          Tag of an already published release to sync. Its presence is what
          marks a run as release-equivalent, because github.event_name
          reports the CALLER's event for workflow_call and so cannot be used
          to tell the two apart.
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-mintlify-docs:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease == false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out core repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          # Called runs generate the spec from the tag that was released, not
          # from whatever main has drifted to during the release (this job
          # starts several minutes in). Empty for every other trigger, which
          # leaves checkout on its default ref.
          ref: ${{ inputs.tag }}

      # Normalize release metadata so the sync script can run unchanged for
      # published releases, manual dispatches, and branch-push preview runs.
      # This step always produces a body file plus synthetic tag/url/date
      # values when the event is not an actual GitHub release.
      - name: Prepare release body file
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Empty unless this workflow was called by another one; see the
          # workflow_call input comment above for why this is the discriminator.
          CALLED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          BODY_FILE="$(mktemp)"
          if [ "${EVENT_NAME}" = "release" ]; then
            RELEASE_MODE=true
            TAG="${RELEASE_TAG}"
            RELEASE_LINK="${RELEASE_URL}"
            PUBLISHED_AT="${RELEASE_PUBLISHED_AT}"
            DOCS_BRANCH_NAME="automation/sync-mintlify-docs-${RELEASE_TAG}"
            printf "%s" "${RELEASE_BODY}" > "${BODY_FILE}"
          elif [ -n "${CALLED_TAG}" ]; then
            RELEASE_MODE=true
            TAG="${CALLED_TAG}"
            # Read the release back from the API rather than threading its
            # notes through job outputs and workflow_call inputs. The release
            # already exists: the caller depends on the job that created it.
            RELEASE_JSON="$(mktemp)"
            gh release view "${CALLED_TAG}" \
              --repo "${REPOSITORY}" \
              --json body,url,publishedAt,isPrerelease > "${RELEASE_JSON}"
            if [ "$(jq -r '.isPrerelease' "${RELEASE_JSON}")" = "true" ]; then
              echo "::error::${CALLED_TAG} is a prerelease; refusing to publish it to docs."
              exit 1
            fi
            RELEASE_LINK="$(jq -r '.url' "${RELEASE_JSON}")"
            PUBLISHED_AT="$(jq -r '.publishedAt' "${RELEASE_JSON}")"
            jq -r '.body' "${RELEASE_JSON}" > "${BODY_FILE}"
            DOCS_BRANCH_NAME="automation/sync-mintlify-docs-${CALLED_TAG}"
          else
            RELEASE_MODE=false
            # The ref goes into a changelog heading and a branch name, so flatten
            # its slashes here too rather than only at the branch name below.
            TAG="test-sync-${REF_NAME//\//-}-${COMMIT_SHA::7}"
            RELEASE_LINK="${SERVER_URL}/${REPOSITORY}/commit/${COMMIT_SHA}"
            PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            # Namespace the branch under automation/ instead of reusing the ref
            # name verbatim. The old value made a dispatch from main check out
            # `main` inside docs-repo and then force-push cognee-docs' own main,
            # which is what failed run 24552485386 at "Push docs branch". The
            # sha keeps repeated dispatches from the same ref on separate
            # branches instead of overwriting one another.
            DOCS_BRANCH_NAME="automation/sync-mintlify-docs-${REF_NAME//\//-}-${COMMIT_SHA::7}"
            printf "%s\n\n- Source commit: \`%s\`\n- Workflow event: \`%s\`\n- Commit URL: %s\n" \
              "Automated docs sync test run from branch \`${REF_NAME}\`." \
              "${COMMIT_SHA}" \
              "${EVENT_NAME}" \
              "${RELEASE_LINK}" > "${BODY_FILE}"
          fi

          SAFE_DOCS_BRANCH_NAME="${DOCS_BRANCH_NAME// /-}"

          echo "body_file=${BODY_FILE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_LINK}" >> "$GITHUB_OUTPUT"
          echo "published_at=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"
          echo "docs_branch_name=${SAFE_DOCS_BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_mode=${RELEASE_MODE}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Check out docs repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          repository: topoteretes/cognee-docs
          token: ${{ secrets.REPO_DISPATCH_PAT_TOKEN }}
          ref: main
          path: docs-repo

      - name: Sync OpenAPI and changelog
        env:
          RELEASE_MODE: ${{ steps.release_meta.outputs.release_mode }}
        run: |
          # A preview run proves the spec pipeline; it must not write release
          # history. Its tag is synthetic, so the entry would be a fabricated
          # release section proposed onto a published page — and because the
          # tag embeds a sha, repeated previews accumulate rather than dedupe.
          SKIP_CHANGELOG=()
          if [ "${RELEASE_MODE}" != "true" ]; then
            SKIP_CHANGELOG=(--skip-changelog)
          fi

          uv run python tools/sync_release_docs.py \
            --docs-repo "${GITHUB_WORKSPACE}/docs-repo" \
            --tag "${{ steps.release_meta.outputs.tag }}" \
            --release-url "${{ steps.release_meta.outputs.release_url }}" \
            --published-at "${{ steps.release_meta.outputs.published_at }}" \
            --release-body-file "${{ steps.release_meta.outputs.body_file }}" \
            "${SKIP_CHANGELOG[@]}"

      - name: Commit docs changes
        id: commit_docs
        working-directory: docs-repo
        run: |
          BRANCH_NAME="${{ steps.release_meta.outputs.docs_branch_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH_NAME}"
          git add cognee_openapi_spec.json changelog.mdx
          if git diff --cached --quiet; then
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
            echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs: sync ${{ steps.release_meta.outputs.tag }}"
          echo "changes_made=true" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Push docs branch
        if: ${{ steps.commit_docs.outputs.changes_made == 'true' }}
        working-directory: docs-repo
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT_TOKEN }}
        run: |
          BRANCH_NAME="${{ steps.commit_docs.outputs.branch_name }}"
          # This step force-pushes, so a branch name that ever resolves to a
          # long-lived docs branch has to fail loudly rather than land.
          case "${BRANCH_NAME}" in
            ""|main|master|HEAD)
              echo "::error::Refusing to force-push cognee-docs '${BRANCH_NAME}'."
              exit 1
              ;;
          esac
          git push --force-with-lease origin "${BRANCH_NAME}"

      - name: Create or update docs pull request
        if: ${{ steps.commit_docs.outputs.changes_made == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT_TOKEN }}
          RELEASE_MODE: ${{ steps.release_meta.outputs.release_mode }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_URL: ${{ steps.release_meta.outputs.release_url }}
          TARGET_REPO: topoteretes/cognee-docs
          HEAD_BRANCH: ${{ steps.commit_docs.outputs.branch_name }}
        run: |
          if [ "${RELEASE_MODE}" = "true" ]; then
            PR_TITLE="docs: sync release ${RELEASE_TAG}"
            PR_BODY=$(cat <<EOF
          Automated sync for release \`${RELEASE_TAG}\`.

          Source release: ${RELEASE_URL}
          EOF
            )
          else
            PR_TITLE="test(docs): preview sync for ${HEAD_BRANCH}"
            PR_BODY=$(cat <<EOF
          Automated preview sync from branch \`${HEAD_BRANCH}\`.

          Source commit/revision: ${RELEASE_URL}
          EOF
            )
          fi

          HEAD_REF="topoteretes:${HEAD_BRANCH}"

          EXISTING_PR_NUMBER="$(gh pr list \
            --repo "${TARGET_REPO}" \
            --head "${HEAD_REF}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${EXISTING_PR_NUMBER}" ]; then
            gh pr edit "${EXISTING_PR_NUMBER}" \
              --repo "${TARGET_REPO}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}"
          else
            gh pr create \
              --repo "${TARGET_REPO}" \
              --base main \
              --head "${HEAD_REF}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}"
          fi
