name: Reusable Product Journey Tests

# High-level product contract tests (cognee/tests/journeys).
#
# mode: mock (default) needs no secrets, so it runs for fork PRs too and gives
# them a real signal. mode: llm runs the same journeys against the real
# providers from secrets; nightly_tests.yml calls it that way.

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12.x'
      ci-image:
        required: false
        type: string
        default: ''
      mode:
        description: "'mock' (deterministic, no secrets) or 'llm' (real providers)."
        required: false
        type: string
        default: 'mock'
    secrets:
      # Only read when mode == 'llm'. Callers pass `secrets: inherit`.
      LLM_PROVIDER:
        required: false
      LLM_MODEL:
        required: false
      LLM_ENDPOINT:
        required: false
      LLM_API_KEY:
        required: false
      LLM_API_VERSION:
        required: false
      EMBEDDING_PROVIDER:
        required: false
      EMBEDDING_MODEL:
        required: false
      EMBEDDING_ENDPOINT:
        required: false
      EMBEDDING_API_KEY:
        required: false

env:
  RUNTIME__LOG_LEVEL: ERROR
  ENV: 'dev'
  TELEMETRY_DISABLED: '1'
  COGNEE_JOURNEY_MODE: ${{ inputs.mode }}
  # llm: provider settings from secrets. mock: never called, but config
  # validation still wants the variables present.
  LLM_PROVIDER: ${{ inputs.mode == 'llm' && secrets.LLM_PROVIDER || 'openai' }}
  LLM_MODEL: ${{ inputs.mode == 'llm' && secrets.LLM_MODEL || 'openai/gpt-5-mini' }}
  LLM_ENDPOINT: ${{ inputs.mode == 'llm' && secrets.LLM_ENDPOINT || '' }}
  LLM_API_KEY: ${{ inputs.mode == 'llm' && secrets.LLM_API_KEY || 'mock-key' }}
  LLM_API_VERSION: ${{ inputs.mode == 'llm' && secrets.LLM_API_VERSION || '' }}
  EMBEDDING_PROVIDER: ${{ inputs.mode == 'llm' && secrets.EMBEDDING_PROVIDER || 'openai' }}
  EMBEDDING_MODEL: ${{ inputs.mode == 'llm' && secrets.EMBEDDING_MODEL || 'openai/text-embedding-3-small' }}
  EMBEDDING_ENDPOINT: ${{ inputs.mode == 'llm' && secrets.EMBEDDING_ENDPOINT || '' }}
  EMBEDDING_API_KEY: ${{ inputs.mode == 'llm' && secrets.EMBEDDING_API_KEY || 'mock-key' }}
  EMBEDDING_DIMENSIONS: ${{ inputs.mode == 'llm' && '300' || '256' }}
  COGNEE_SKIP_PREFLIGHT: ${{ inputs.mode == 'mock' && '1' || '' }}
  COGNEE_SKIP_CONNECTION_TEST: 'true'

jobs:
  journeys:
    name: Product Journeys (${{ inputs.mode }} LLM)
    runs-on: ubuntu-22.04
    # llm mode makes a few hundred provider calls; observed ~30 min locally.
    timeout-minutes: ${{ inputs.mode == 'llm' && 90 || 30 }}
    container: ${{ inputs.ci-image != '' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', inputs.ci-image, github.actor, github.token)) || null }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Memory correctness, sessions, lifecycle, idempotency, HTTP API, extras resolution
        run: |
          uv run pytest cognee/tests/journeys -m "journey and not quickstart" \
            --ignore=cognee/tests/journeys/test_mcp_journey.py \
            -v --timeout=4800 -p no:cacheprovider -W ignore

  quickstart:
    name: Quickstart in a fresh venv (${{ inputs.mode }} LLM, wheel install)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build wheel, install into empty venv, run README quickstart
        env:
          COGNEE_JOURNEY_QUICKSTART: '1'
        run: |
          uv run pytest cognee/tests/journeys/test_quickstart.py -m quickstart \
            -v --timeout=1500 -p no:cacheprovider -W ignore

  mcp:
    name: MCP as a client uses it (${{ inputs.mode }} LLM, stdio + HTTP)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Spawn cognee-mcp over stdio and HTTP, remember and recall through the tools
        run: |
          uv run --with "fastmcp>=3.4.0,<4.0.0" --with "mcp>=1.24.0,<2.0.0" \
            pytest cognee/tests/journeys/test_mcp_journey.py \
            -v --timeout=1500 -p no:cacheprovider -W ignore

  extras-install:
    name: Install smoke — cognee[${{ matrix.extras }}]
    # Provider-independent, so only the mock-mode caller (the PR gate) runs it.
    if: ${{ inputs.mode == 'mock' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        extras:
          - "neo4j,neptune,postgres-binary,turso,redis,tracing,aws"
          - "anthropic,azure,groq,mistral,ollama,posthog,debug,notebook"
          - "fastembed,huggingface,codegraph,rapidocr"
          - "docs,langchain,llama-index,graphiti"
          - "docling,docling-full"
          - "dlt,gmail,scraping,evals,deepeval,baml,dev"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build the wheel, install each extra into an empty venv, import what it enables
        env:
          COGNEE_JOURNEY_EXTRAS: '1'
          COGNEE_EXTRAS: ${{ matrix.extras }}
        run: |
          uv run pytest cognee/tests/journeys/test_extras_install_smoke.py -k installs_and_imports \
            -v --timeout=2400 -p no:cacheprovider -W ignore
