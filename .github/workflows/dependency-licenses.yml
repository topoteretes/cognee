name: Dependency license review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  dependency-license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.14'
          enable-cache: false
      - name: Test license policy evaluation
        run: uv run --no-project --python 3.12 --with license-expression==30.4.4 python -m unittest discover -s scripts/tests -p 'test_dependency_licenses.py' -v
      - name: Require Python manifests to match their lockfiles
        run: |
          uv lock --check
          uv lock --check --project cognee-mcp
      - name: Check added and updated dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --script scripts/check_dependency_licenses.py --base "$BASE_SHA" --head "$HEAD_SHA"
