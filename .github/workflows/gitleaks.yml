name: gitleaks
on:
  pull_request:
  push:
    branches:
      - dev
      - main
jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@latest
      - run: gitleaks dir -v -c .gitleaks.toml .
