name: automation | Router Docstring Describe

# Second stage of the router docstring loop. The sync workflow
# (router_docstring_sync.yml) fixes parameter drift mechanically, but leaves
# "No description provided in code yet." on parameters whose meaning it cannot
# derive from code. This workflow picks those up on the bot branch, asks
# Claude for a one-sentence description of each (grounded in the endpoint's
# source), and commits the improved bullets to the same branch, refreshing
# the open fix PR.

on:
  workflow_dispatch:
  # Runs after every sync push of the fix branch. Its own push retriggers one
  # more run, which finds no placeholders and exits without committing.
  push:
    branches:
      - automation/fix-router-docstrings
  # Runs on PRs that change the describe machinery itself, so its behavior
  # can be observed before merge. The job always operates on the fix branch.
  pull_request:
    paths:
      - "tools/describe_router_params.py"
      - ".github/workflows/router_docstring_describe.yml"

permissions:
  contents: write

concurrency:
  group: router-docstring-describe
  cancel-in-progress: true

jobs:
  describe-params:
    name: Generate missing parameter descriptions with Claude
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      # The tree being edited is always the sync workflow's fix branch; the
      # machinery is taken from the triggering ref via a second checkout, so
      # a PR changing it exercises its own version before merge.
      - name: Check out the fix branch
        uses: actions/checkout@v6
        with:
          ref: automation/fix-router-docstrings
          token: ${{ secrets.REPO_DISPATCH_PAT_TOKEN }}

      - name: Check out describe machinery from the triggering ref
        uses: actions/checkout@v6
        with:
          path: automation-src

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The script works on text and AST only — no cognee environment needed,
      # just the anthropic SDK in an ephemeral interpreter.
      - name: Generate descriptions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --no-project --with anthropic \
            python automation-src/tools/describe_router_params.py

      - name: Commit and push
        run: |
          if git diff --quiet -- cognee; then
            echo "No description changes to commit."
            exit 0
          fi
          uvx ruff format cognee/api
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cognee
          git commit -m "docs: Generate parameter descriptions with Claude (RES-14)"
          git push origin HEAD:automation/fix-router-docstrings
