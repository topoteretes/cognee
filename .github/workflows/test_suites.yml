name: Test Suites
permissions:
  contents: read
  packages: read  # reusable test workflows pull the ghcr.io CI image

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
    # No `labeled`: label-core-team.yml labels every core-team PR on open, and
    # a `labeled` trigger queued a second run that cancelled the first (both
    # runs on the same sha, seconds apart, on every PR).
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but never a push-to-dev run: consecutive merges
  # were cancelling each other's full run (15 of the last 40 push runs), so
  # dev's real state was unknown most of the time.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNTIME__LOG_LEVEL: ERROR
  ENV: 'dev'

jobs:
  # ── Build pre-baked CI container ──────────────────────────────────────
  build-ci-env:
    permissions:
      contents: read
      packages: write  # pushes the CI image
    name: Build CI Environment
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      ci-image: ${{ steps.set-image.outputs.image }}
    steps:
      - name: Sparse checkout (deps only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            pyproject.toml
            uv.lock
            README.md
            Dockerfile.ci
            .dockerignore.ci
          sparse-checkout-cone-mode: false

      - name: Compute dep hash and image tag
        id: set-image
        run: |
          # Dockerfile.ci is part of the key: it decides which extras get baked
          # into the image, so changing it must produce a new tag (the build is
          # skipped whenever the tag already exists).
          DEP_HASH=$(sha256sum pyproject.toml uv.lock Dockerfile.ci | sha256sum | head -c 16)
          IMAGE="ghcr.io/${{ github.repository }}/ci-env:deps-${DEP_HASH}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dep_hash=${DEP_HASH}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${IMAGE}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          if docker manifest inspect "${{ steps.set-image.outputs.image }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image not found, will build."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push CI image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.set-image.outputs.image }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/ci-env:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/ci-env:buildcache,mode=max

  pre-test:
    name: basic checks
    uses: ./.github/workflows/pre_test.yml

  basic-tests:
    name: Basic Tests
    uses: ./.github/workflows/basic_tests.yml
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  e2e-tests:
    name: End-to-End Tests
    uses: ./.github/workflows/e2e_tests.yml
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  cli-tests:
    name: CLI Tests
    uses: ./.github/workflows/cli_tests.yml
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  journey-tests:
    # Product contract journeys in mock-LLM mode: no secrets, so fork PRs get a
    # real signal here even when the secret-dependent suites cannot run.
    name: Product Journeys
    uses: ./.github/workflows/journey_tests.yml
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}

  slow-e2e-tests:
    name: Slow End-to-End Tests
    uses: ./.github/workflows/slow_e2e_tests.yml
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  graph-db-tests:
    name: Graph Database Tests
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/graph_db_tests.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  vector-db-tests:
    name: Vector DB Tests
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/vector_db_tests.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  example-tests:
    name: Example Tests
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/examples_tests.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  notebook-tests:
    name: Notebook Tests
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/notebooks_tests.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  different-os-tests-basic:
    name: OS and Python Tests Ubuntu
    uses: ./.github/workflows/test_different_operating_systems.yml
    with:
      # The interpreter edges only. Every version-specific fix on dev since
      # 2025-06 was 3.10 (5) or 3.14 (1); none was 3.11/3.12/3.13-only. Those
      # three run in release_test.yml instead. The unit suite is byte-identical across the
      # legs, so this cuts three of eight copies with no change in what a
      # passing run proves.
      python-versions: '["3.10.x", "3.14.x"]'
      os: '["ubuntu-22.04"]'
      # postgres so the SQL cache adapter tests run instead of skipping; omitted
      # on macos/windows (extended) where psycopg2 has no prebuilt wheels.
      # aws/neptune/langchain/dlt: the CI-image copy of the unit suite (deleted
      # -- it was the slowest of eight identical copies, behind a 3-minute image
      # pull) was the only leg with these, and four test files importorskip on
      # them. Resolved from the existing lock on 3.10.
      extra-dependencies: 'postgres aws neptune langchain dlt'
    secrets: inherit

  different-os-tests-extended:
    name: OS and Python Tests Extended
    uses: ./.github/workflows/test_different_operating_systems.yml
    with:
      python-versions: '["3.13.x"]'
      os: '["macos-15", "windows-latest"]'
    secrets: inherit

  llm-tests:
    name: LLM Test Suite
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/test_llms.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  s3-file-storage-test:
    name: S3 File Storage Test
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/test_s3_file_storage.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  integration-tests:
    name: Run Integration Tests
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/integration_tests.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  mcp-test:
    name: MCP Tests
    uses: ./.github/workflows/test_mcp.yml
    secrets: inherit

  docker-compose-test:
    name: Docker Compose Test
    uses: ./.github/workflows/docker_compose.yml
    secrets: inherit

  docker-ci-test:
    name: Docker CI test
    uses: ./.github/workflows/backend_docker_build_test.yml
    secrets: inherit

  ui-docker-ci-test:
    name: UI Docker CI test
    uses: ./.github/workflows/frontend_docker_build_test.yml
    secrets: inherit

  temporal-graph-tests:
    name: Temporal Graph Test
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/temporal_graph_tests.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  search-db-tests:
    name: Search Test on Different DBs
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/search_db_tests.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
      # One Python per backend combo, not four. Half of the sixteen legs ran
      # in the CI image, which pins Python 3.11 regardless of the matrix: the
      # job labelled "Python 3.13" logged "Python 3.11.14". So those were the
      # same run four times. The Python dimension is the unit matrix's job;
      # this workflow's value is the four backend combos, which all stay.
      # The full version sweep for the two bare Neo4j jobs runs in release_test.yml.
      python-versions: '["3.11"]'
    secrets: inherit

  relational-db-migration-tests:
    name: Relational DB Migration Tests
    needs: [ build-ci-env ]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/relational_db_migration_tests.yml
    with:
      ci-image: ${{ needs.build-ci-env.outputs.ci-image || '' }}
    secrets: inherit

  notify:
    name: Test Completion Status
    needs: [
      pre-test,
      basic-tests,
      e2e-tests,
      cli-tests,
      journey-tests,
      slow-e2e-tests,
      graph-db-tests,
      vector-db-tests,
      example-tests,
      notebook-tests,
      different-os-tests-basic,
      different-os-tests-extended,
      llm-tests,
      s3-file-storage-test,
      integration-tests,
      mcp-test,
      docker-compose-test,
      docker-ci-test,
      ui-docker-ci-test,
      temporal-graph-tests,
      search-db-tests,
      relational-db-migration-tests,
    ]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Check Status
        run: |
          if [[ "${{ needs.pre-test.result }}" == "success" &&
                "${{ needs.basic-tests.result }}" == "success" &&
                "${{ needs.e2e-tests.result }}" == "success" &&
                "${{ needs.cli-tests.result }}" == "success" &&
                "${{ needs.journey-tests.result }}" == "success" &&
                "${{ needs.slow-e2e-tests.result }}" == "success" &&
                "${{ needs.graph-db-tests.result }}" == "success" &&
                "${{ needs.vector-db-tests.result }}" == "success" &&
                "${{ needs.example-tests.result }}" == "success" &&
                "${{ needs.notebook-tests.result }}" == "success" &&
                "${{ needs.different-os-tests-basic.result }}" == "success" &&
                "${{ needs.different-os-tests-extended.result }}" == "success" &&
                "${{ needs.llm-tests.result }}" == "success" &&
                "${{ needs.s3-file-storage-test.result }}" == "success" &&
                "${{ needs.integration-tests.result }}" == "success" &&
                "${{ needs.mcp-test.result }}" == "success" &&
                "${{ needs.docker-compose-test.result }}" == "success" &&
                "${{ needs.docker-ci-test.result }}" == "success" &&
                "${{ needs.ui-docker-ci-test.result }}" == "success" &&
                "${{ needs.temporal-graph-tests.result }}" == "success" &&
                "${{ needs.search-db-tests.result }}" == "success" &&
                "${{ needs.relational-db-migration-tests.result }}" == "success" ]]; then
            echo "All test suites completed successfully!"
          else
            echo "One or more test suites failed."
            exit 1
          fi

  # ── Advisory Claude Code review — pulls the private skill from cognee-ci at runtime ──
  # The rubric + Slack map live in the private cognee-ci repo; this job carries no review
  # logic. Runs only after the suite is green (needs: notify), core-team PRs only, advisory.
  # The reviewer can also get a "codebase memory": the Cognee code graph of this repo on
  # Cognee Cloud, queried through the cognee-mcp server (API mode, X-Api-Key). It is what
  # lets the review say "this helper already exists at path:line" about code outside the
  # diff. It needs the COGNEE_MCP_BASE_URL + COGNEE_MCP_API_KEY secrets and is switched on
  # per author by the PR_REVIEW_MEMORY_AUTHORS variable ('*' = everyone, a comma-separated
  # list of logins = a trial, empty = nobody). Authors in the trial get the
  # /pr-review-memory skill; everyone else keeps the classic /pr-review, unchanged.
  claude-review:
    name: Claude Code Review
    needs: [ notify ]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      # Pinned MCP server release, installed from PyPI (never from the PR checkout, so PR
      # code cannot sit between the reviewer and the API key). Bump deliberately.
      COGNEE_MCP_VERSION: "0.5.6"
      # Read by claude-code-action from the job-level env (its own step env shadows
      # anything set lower). cognee-mcp imports cognee on start and a code-graph query
      # over the whole repo takes seconds; the action's defaults are too tight for both.
      MCP_TIMEOUT: "120000"
      MCP_TOOL_TIMEOUT: "180000"
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Core-team gate
        id: gate
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # Both secrets are needed for the codebase memory.
          COGNEE_SECRETS: ${{ secrets.COGNEE_MCP_API_KEY != '' && secrets.COGNEE_MCP_BASE_URL != '' }}
          # Who gets the memory-backed review: '*' = every core-team author, a comma-
          # separated list of GitHub logins = only those (trial), empty = nobody.
          MEMORY_AUTHORS: ${{ vars.PR_REVIEW_MEMORY_AUTHORS }}
          # The code-graph dataset the memory skill queries on the tenant.
          DATASET: ${{ vars.COGNEE_MCP_DATASET || 'cognee_code' }}
          # Model for the memory-backed review; the classic review keeps its pinned model.
          MEMORY_MODEL: ${{ vars.PR_REVIEW_MODEL || 'claude-sonnet-4-5-20250929' }}
        run: |
          author_lc="$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')"
          if grep -vE '^[[:space:]]*#' .github/core-team.txt \
               | sed 's/^@//' | tr '[:upper:]' '[:lower:]' | grep -qxF "$author_lc"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "PR author '$AUTHOR' not in core-team.txt — skipping."
          fi
          memory=false
          if [ "$COGNEE_SECRETS" = "true" ]; then
            if [ "$MEMORY_AUTHORS" = "*" ]; then
              memory=true
            elif printf '%s' "$MEMORY_AUTHORS" | tr ',' '\n' \
                   | sed 's/^[[:space:]@]*//; s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]' \
                   | grep -qxF "$author_lc"; then
              memory=true
            fi
          fi
          # The classic path keeps exactly today's prompt, turn budget and model; only
          # the memory path gets the larger budget (graph queries cost turns) and the
          # PR_REVIEW_MODEL override.
          if [ "$memory" = "true" ]; then
            {
              echo "cognee_memory=true"
              echo "prompt=/pr-review-memory $DATASET"
              echo "max_turns=80"
              echo "model=$MEMORY_MODEL"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "cognee_memory=false"
              echo "prompt=/pr-review"
              echo "max_turns=40"
              echo "model=claude-sonnet-4-5-20250929"
            } >> "$GITHUB_OUTPUT"
            echo "Classic review for '$AUTHOR' (secrets set: $COGNEE_SECRETS, PR_REVIEW_MEMORY_AUTHORS: '${MEMORY_AUTHORS:-}')."
          fi

      - name: Mint private-repo token
        if: ${{ steps.gate.outputs.run == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cognee-ci

      - name: Fetch private review skill + slack map
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/cognee-ci
          token: ${{ steps.app-token.outputs.token }}
          path: .ci-private

      - name: Stage skill into the user skills dir
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          # Stage into the USER skills dir ($HOME/.claude), NOT the repo's .claude/.
          # claude-code-action sanitizes the repo .claude for untrusted PR heads
          # (it moves the working-tree .claude to .claude-pr/ and restores a clean
          # .claude from the base branch), which wipes the staged private skill and
          # leaves /pr-review unresolved -> 0 turns, nothing posted. $HOME/.claude is
          # untouched by that sanitization and is loaded via settingSources: [user,...].
          mkdir -p "$HOME/.claude/skills"
          cp -r .ci-private/.claude/skills/pr-review* "$HOME/.claude/skills/"

      # The two memory steps are continue-on-error: a PyPI hiccup or a tenant outage
      # must degrade the review to "memory unavailable", not skip it (and the Slack DM
      # with it). No uv cache: it would key on the repo lockfiles, which have nothing
      # to do with `uv tool install`, and the install takes seconds.
      - name: Set up uv (Cognee MCP server)
        id: uv-setup
        if: ${{ steps.gate.outputs.run == 'true' && steps.gate.outputs.cognee_memory == 'true' }}
        continue-on-error: true
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Install and probe the Cognee MCP server
        id: mcp-install
        if: ${{ steps.gate.outputs.run == 'true' && steps.uv-setup.outcome == 'success' }}
        continue-on-error: true
        env:
          COGNEE_MCP_BASE_URL: ${{ secrets.COGNEE_MCP_BASE_URL }}
          COGNEE_MCP_API_KEY: ${{ secrets.COGNEE_MCP_API_KEY }}
          DATASET: ${{ vars.COGNEE_MCP_DATASET || 'cognee_code' }}
        run: |
          uv tool install "cognee-mcp==${COGNEE_MCP_VERSION}"
          # The server runs through this wrapper, from an EMPTY directory outside the
          # workspace: cognee loads a .env found in its working directory with
          # precedence over the process environment, and the PR checkout could carry
          # one (HTTPS_PROXY / SSL_CERT_FILE there would let it read the key in
          # transit). An empty cwd with no .env in its parents closes that door.
          mkdir -p "$RUNNER_TEMP/cognee-cwd"
          cat > "$RUNNER_TEMP/cognee-mcp.sh" <<EOF
          #!/usr/bin/env bash
          cd "$RUNNER_TEMP/cognee-cwd" && exec "$(uv tool dir --bin)/cognee-mcp" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/cognee-mcp.sh"
          # Probe the exact path the review will use: the wrapper, stdio, API mode with
          # the tenant URL and key, one code_search over the dataset. A broken install,
          # a rejected key or an empty dataset fails here with a readable error instead
          # of a silent "Codebase memory: unavailable" at the end of the review.
          cat > "$RUNNER_TEMP/cognee-probe.py" <<'PY'
          import json, os, select, subprocess, sys, time
          wrapper, dataset = sys.argv[1], sys.argv[2]
          p = subprocess.Popen(
              [wrapper, "--transport", "stdio", "--tool-mode", "all",
               "--api-url", os.environ["COGNEE_MCP_BASE_URL"], "--api-auth-scheme", "x-api-key"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, bufsize=1,
              env={**os.environ, "COGNEE_API_KEY": os.environ["COGNEE_MCP_API_KEY"]},
          )
          def send(m):
              p.stdin.write(json.dumps(m) + "\n"); p.stdin.flush()
          def recv(i, timeout):
              end = time.time() + timeout
              while time.time() < end:
                  if select.select([p.stdout], [], [], 1.0)[0]:
                      line = p.stdout.readline()
                      if not line:
                          sys.exit("probe: server closed stdout (rc=%s)" % p.poll())
                      try:
                          m = json.loads(line)
                      except ValueError:
                          continue
                      if m.get("id") == i:
                          return m
                  elif p.poll() is not None:
                      sys.exit("probe: server exited rc=%s" % p.returncode)
              sys.exit("probe: timeout waiting for response %s" % i)
          send({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18",
                "capabilities": {}, "clientInfo": {"name": "ci-probe", "version": "0"}}})
          recv(1, 120)
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "code_search", "arguments": {
                "operation": "query_facts", "arguments": {"kinds": ["module"], "limit": 1}, "datasets": dataset}}})
          res = recv(2, 120).get("result") or {}
          text = "".join(c.get("text", "") for c in res.get("content", []))
          p.terminate()
          if res.get("isError") or '"operation"' not in text:
              sys.exit("probe: code_search over %r failed: %s" % (dataset, text[:300]))
          print("probe: code_search over %r answered (%d chars)" % (dataset, len(text)))
          PY
          timeout 300 python3 "$RUNNER_TEMP/cognee-probe.py" "$RUNNER_TEMP/cognee-mcp.sh" "$DATASET"

      - name: Build the Cognee MCP config
        id: mcp-config
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          COGNEE_MEMORY: ${{ steps.gate.outputs.cognee_memory == 'true' && steps.mcp-install.outcome == 'success' }}
        run: |
          # Passed to the action as INLINE JSON, not a file: claude-code-action merges
          # every --mcp-config value and keeps a file path only when no inline JSON is
          # present, and its own GitHub servers are always inline — a file path would be
          # silently dropped (base-action/src/parse-sdk-options.ts, mergeMcpConfigs).
          # The key is a ${VAR} placeholder that Claude Code expands from the review
          # step's environment, so neither this output nor the log holds a credential.
          # The tenant URL and auth scheme are CLI args, so nothing in the process
          # environment can point the key at another host. For authors outside the
          # trial, without the secrets, or with the probe failed, the config declares
          # no servers and the memory skill reports "Codebase memory: unavailable".
          if [ "$COGNEE_MEMORY" = "true" ]; then
            json=$(jq -c -n --arg cmd "$RUNNER_TEMP/cognee-mcp.sh" '{
              mcpServers: { cognee: {
                type: "stdio",
                command: $cmd,
                args: ["--transport", "stdio", "--tool-mode", "all",
                       "--api-url", "${COGNEE_MCP_BASE_URL}", "--api-auth-scheme", "x-api-key"],
                env: { COGNEE_API_KEY: "${COGNEE_MCP_API_KEY}" }
              } }
            }')
          else
            json='{"mcpServers":{}}'
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Claude Code review
        id: review
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790  # v1.0.235
        env:
          # Expanded by Claude Code into the MCP config above (not by the shell). Step
          # scoped on purpose: no other step needs the key.
          COGNEE_MCP_BASE_URL: ${{ secrets.COGNEE_MCP_BASE_URL }}
          COGNEE_MCP_API_KEY: ${{ secrets.COGNEE_MCP_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # "/pr-review-memory <dataset>" for authors in the trial, "/pr-review" otherwise.
          prompt: ${{ steps.gate.outputs.prompt }}
          claude_args: >-
            --mcp-config '${{ steps.mcp-config.outputs.json }}'
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,mcp__cognee__code_search,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --max-turns ${{ steps.gate.outputs.max_turns }}
            --model ${{ steps.gate.outputs.model }}

      # Trial diagnostics: the action does not print Claude's transcript, so without
      # this a "Codebase memory: unavailable" cannot be traced. Secrets are masked by
      # Actions; drop this step once the memory review is on for everyone.
      - name: Upload the review transcript
        if: ${{ always() && steps.gate.outputs.run == 'true' && steps.gate.outputs.cognee_memory == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: claude-review-transcript-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 7

      - name: DM review summary to PR author on Slack
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: python3 .ci-private/scripts/pr_review_slack_notify.py
