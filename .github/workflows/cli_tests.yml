name: test | cli

# Least-privilege GITHUB_TOKEN (OSSF Scorecard: Token-Permissions). A caller can
# only narrow this further. packages: read is required: the jobs run inside the
# private ghcr.io CI image (and pull ghcr.io service images), which the runner
# fetches with this token before the first step. Nothing here writes.
permissions:
  contents: read
  packages: read

on:
  workflow_call:
    inputs:
      has-secrets:
        # False on fork PRs, where GitHub withholds repository secrets. Jobs
        # that need a real LLM/embedding key skip instead of failing on an
        # empty key. Other callers leave the default and run everything.
        required: false
        type: boolean
        default: true
      python-version:
        required: false
        type: string
        default: '3.11.x'
      cognee_version:
        required: false
        type: string
        default: "local"
        description: "Pypi-compatible version of cognee to use. For example, 0.5.2.dev0. `local` (default) - Installing Cognee from local source"
      ci-image:
        required: false
        type: string
        default: ''
    # Optional, not required: on a fork PR `secrets: inherit` passes none, and a
    # required secret makes GitHub refuse to start ANY job in this workflow,
    # including the ones that need no key. Jobs that do need one gate on
    # inputs.has-secrets instead.
    secrets:
      LLM_PROVIDER:
        required: false
      LLM_MODEL:
        required: false
      LLM_ENDPOINT:
        required: false
      LLM_API_KEY:
        required: false
      LLM_ARGS:
        required: false
      LLM_API_VERSION:
        required: false
      EMBEDDING_PROVIDER:
        required: false
      EMBEDDING_MODEL:
        required: false
      EMBEDDING_API_KEY:
        required: false

env:
  RUNTIME__LOG_LEVEL: ERROR
  ENV: 'dev'
  COGNEE_SKIP_CONNECTION_TEST: 'true'

jobs:
  cli-unit-tests:
    name: CLI Unit Tests
    if: ${{ inputs.cognee_version == 'local' }}
    runs-on: ubuntu-22.04
    container: ${{ inputs.ci-image != '' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', inputs.ci-image, github.actor, github.token)) || null }}
    env:
      ENV: 'dev'
      LLM_PROVIDER: openai
      LLM_MODEL: "openai/gpt-4o-mini"
      LLM_API_KEY: "mock-not-used"
      EMBEDDING_MODEL: "openai/text-embedding-3-large"
      EMBEDDING_API_KEY: "mock-not-used"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run CLI Unit Tests
        run: uv run pytest cognee/tests/cli_tests/cli_unit_tests/ -v

  cli-integration-tests:
    name: CLI Integration Tests
    if: ${{ inputs.has-secrets }}
    runs-on: ubuntu-22.04
    container: ${{ inputs.ci-image != '' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', inputs.ci-image, github.actor, github.token)) || null }}
    env:
      ENV: 'dev'
      LLM_PROVIDER: openai
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_ARGS: ${{ secrets.LLM_ARGS }}
      LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}
      EMBEDDING_DIMENSIONS: 300
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Cognee
        uses: ./.github/actions/install_cognee
        with:
          python-version: ${{ inputs.python-version }}
          cognee_version: ${{ inputs.cognee_version }}

      - name: Run CLI Integration Tests
        run: uv run pytest cognee/tests/cli_tests/cli_integration_tests/ -v

  cli-functionality-tests:
    name: CLI Functionality Tests
    if: ${{ inputs.has-secrets }}
    runs-on: ubuntu-22.04
    container: ${{ inputs.ci-image != '' && fromJSON(format('{{"image":"{0}","credentials":{{"username":"{1}","password":"{2}"}}}}', inputs.ci-image, github.actor, github.token)) || null }}
    env:
      ENV: 'dev'
      LLM_PROVIDER: openai
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_ARGS: ${{ secrets.LLM_ARGS }}
      LLM_API_VERSION: ${{ secrets.LLM_API_VERSION }}
      EMBEDDING_DIMENSIONS: 300
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: Cognee Setup
        uses: ./.github/actions/cognee_setup
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Cognee
        uses: ./.github/actions/install_cognee
        with:
          python-version: ${{ inputs.python-version }}
          cognee_version: ${{ inputs.cognee_version }}

      - name: Test CLI Help Commands
        run: |
          uv run python -m cognee.cli._cognee --help
          uv run python -m cognee.cli._cognee --version
          uv run python -m cognee.cli._cognee add --help
          uv run python -m cognee.cli._cognee search --help
          uv run python -m cognee.cli._cognee cognify --help
          uv run python -m cognee.cli._cognee delete --help
          uv run python -m cognee.cli._cognee config --help

      - name: Test CLI Config Subcommands
        run: |
          uv run python -m cognee.cli._cognee config get --help
          uv run python -m cognee.cli._cognee config set --help
          uv run python -m cognee.cli._cognee config list --help
          uv run python -m cognee.cli._cognee config unset --help
          uv run python -m cognee.cli._cognee config reset --help

      - name: Test CLI Error Handling
        run: |
          # Test invalid command (should fail gracefully)
          ! uv run python -m cognee.cli._cognee invalid_command

          # Test missing required arguments (should fail gracefully)
          ! uv run python -m cognee.cli._cognee search

          # Test invalid search type (should fail gracefully)
          ! uv run python -m cognee.cli._cognee search "test" --query-type INVALID_TYPE

          # Test invalid chunker (should fail gracefully)
          ! uv run python -m cognee.cli._cognee cognify --chunker InvalidChunker
