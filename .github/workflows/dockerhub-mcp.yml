name: build | Build and Push Cognee MCP Docker Image to dockerhub

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build-and-push:
    runs-on:
      group: Default
      labels:
        - docker_build_runner

    steps:
      - name: Check and free disk space before build
        run: |
          echo "=== Before cleanup ==="
          df -h
          echo "Removing unused preinstalled SDKs to free space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          echo "=== After cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Docker Hub credentials
        id: credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials are not configured; skipping image publication."
          fi

      - name: Set up Docker Buildx
        if: steps.credentials.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --root /tmp/buildkit

      - name: Log in to Docker Hub
        if: steps.credentials.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        if: steps.credentials.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cognee/cognee-mcp
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.credentials.outputs.available == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: cognee-mcp/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=cognee/cognee-mcp:buildcache
          cache-to: type=registry,ref=cognee/cognee-mcp:buildcache,mode=max


      - name: Image digest
        if: steps.credentials.outputs.available == 'true'
        run: echo ${{ steps.build.outputs.digest }}
