name: automation | Router Docstring Sync

# Keeps route-handler docstrings in sync with what the handlers actually
# accept. The published cognee_openapi_spec.json is generated straight from
# the FastAPI app (tools/sync_release_docs.py -> app.openapi()), so these
# docstrings are what keeps the spec's endpoint descriptions honest.
#
# When drift is detected, this workflow does not fail a build — it runs a
# two-stage fix: the sync job corrects parameter drift mechanically
# (tools/fix_router_docstrings.py) and opens/updates a PR against dev, then
# the describe job asks Claude to write descriptions for any parameters the
# mechanical fix could not source wording for
# (tools/describe_router_params.py), committing them to the same PR.
#
# When the mechanical fix produces content identical to what is already on
# the fix branch (tracked via the Sync-Content-Hash commit trailer), the
# push, the Claude call, and the PR update are all skipped — so repeated
# dev pushes with unchanged drift cost nothing and never clobber
# previously generated descriptions.

on:
  pull_request: 
  workflow_dispatch:
  # Weekly backstop sweep (runs from the default branch, fixes dev).
  schedule:
    - cron: "0 6 * * 1"
  # Run whenever something lands on dev that can move the API schema:
  # handlers and DTOs anywhere under cognee/, or dependency bumps (a
  # FastAPI/Pydantic upgrade can change what the handlers expose).
  push:
    branches:
      - dev
    paths:
      - "cognee/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tools/check_router_docstrings.py"
      - "tools/fix_router_docstrings.py"
      - "tools/describe_router_params.py"
      - ".github/workflows/router_docstring_sync.yml"

permissions:
  contents: write
  pull-requests: write

# Queue rather than cancel: a run cancelled between the branch push and the
# PR update would leave the fix PR half-refreshed.
concurrency:
  group: router-docstring-sync
  cancel-in-progress: false

jobs:
  sync-docstrings:
    name: Detect and fix router docstring drift
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      changes_made: ${{ steps.commit.outputs.changes_made }}

    steps:
      # The tree being fixed is always dev; the machinery (checker, fixer)
      # comes from the triggering ref — dev itself on push runs, the default
      # branch on schedule/dispatch runs. Credentials are never persisted
      # into the checkouts: this job imports the full cognee app (and its
      # dependency tree), and nothing that runs there should be able to read
      # a token off disk. The push/PR steps receive the PAT explicitly.
      - name: Check out dev
        uses: actions/checkout@v6
        with:
          ref: dev
          persist-credentials: false

      - name: Check out sync machinery from the triggering ref
        uses: actions/checkout@v6
        with:
          path: automation-src
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras

      # Imports the same FastAPI app the published OpenAPI spec is generated
      # from and compares each handler's documented parameters against the
      # parameters it actually takes.
      - name: Detect docstring drift
        id: check
        run: |
          set +e
          uv run python automation-src/tools/check_router_docstrings.py > docstring_report.txt
          code=$?
          set -e
          cat docstring_report.txt
          cat docstring_report.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 2 ]; then
            echo "Checker failed to import the app" >&2
            exit 2
          fi
          echo "drift=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Fix docstrings
        if: ${{ steps.check.outputs.drift == 'true' }}
        run: |
          uv run python automation-src/tools/fix_router_docstrings.py
          uv run ruff format cognee
          # The fix must fully converge — fail loudly if anything is left.
          uv run python automation-src/tools/check_router_docstrings.py

      - name: Commit and push fix branch
        id: commit
        if: ${{ steps.check.outputs.drift == 'true' }}
        env:
          PUSH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT_TOKEN }}
        run: |
          BRANCH_NAME="automation/fix-router-docstrings"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH_NAME}"
          git add cognee
          if git diff --cached --quiet; then
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip the push — and everything downstream (Claude call, PR
          # update, CI on the fix PR) — when the mechanical fix produced
          # exactly the content already on the remote fix branch. The
          # cognee/ subtree hash of each sync commit is recorded as a
          # Sync-Content-Hash trailer; the describe job commits on top
          # without changing it, so its generated descriptions survive
          # every no-change rerun.
          CONTENT_HASH=$(git rev-parse "$(git write-tree):cognee")
          PREVIOUS_HASH=""
          if git fetch origin "${BRANCH_NAME}" 2>/dev/null; then
            PREVIOUS_HASH=$(git log FETCH_HEAD -n 5 --format=%B \
              | sed -n 's/^Sync-Content-Hash: //p' | head -1)
          fi
          if [ -n "${PREVIOUS_HASH}" ] && [ "${CONTENT_HASH}" = "${PREVIOUS_HASH}" ]; then
            echo "Fix branch already carries this content (${CONTENT_HASH}) — skipping push."
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit \
            -m "docs: Sync router docstrings with handlers (RES-14)" \
            -m "Sync-Content-Hash: ${CONTENT_HASH}"
          git push --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${BRANCH_NAME}"
          echo "changes_made=true" >> "$GITHUB_OUTPUT"
          echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create or update fix PR
        if: ${{ steps.commit.outputs.changes_made == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT_TOKEN }}
          HEAD_BRANCH: ${{ steps.commit.outputs.branch_name }}
        run: |
          PR_TITLE="docs: Sync router docstrings with handlers (RES-14)"
          {
            echo "Automated router docstring sync."
            echo
            echo "The docstring checker found handlers whose documented parameters"
            echo "no longer match their signatures. The fixes below were generated"
            echo "from the handlers' own FastAPI/Pydantic metadata; a follow-up"
            echo "commit fills the remaining descriptions with Claude. Review the"
            echo "wording before merging."
            echo
            echo '```'
            cat docstring_report.txt
            echo '```'
          } > pr_body.md

          EXISTING_PR_NUMBER="$(gh pr list \
            --head "${HEAD_BRANCH}" \
            --base dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${EXISTING_PR_NUMBER}" ]; then
            # REST instead of 'gh pr edit': the edit command needs read:org
            # for its GraphQL query, which this repo-scoped PAT does not have.
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${EXISTING_PR_NUMBER}" \
              --method PATCH \
              --field title="${PR_TITLE}" \
              --field body="$(cat pr_body.md)"
          else
            gh pr create \
              --base dev \
              --head "${HEAD_BRANCH}" \
              --title "${PR_TITLE}" \
              --body-file pr_body.md
          fi

  describe-params:
    name: Generate missing parameter descriptions with Claude
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: sync-docstrings
    # Runs whenever the sync job pushed fresh fixes; also on manual dispatch,
    # to fill placeholders on an already-existing fix branch.
    if: ${{ needs.sync-docstrings.outputs.changes_made == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      # Dispatch runs may fire when no fix branch exists — degrade to a
      # no-op instead of failing at checkout.
      - name: Check the fix branch exists
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/branches/automation/fix-router-docstrings" \
              --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Fix branch does not exist — nothing to describe."
          fi

      - name: Check out the fix branch
        if: ${{ steps.branch.outputs.exists == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: automation/fix-router-docstrings
          persist-credentials: false

      - name: Check out describe machinery from the triggering ref
        if: ${{ steps.branch.outputs.exists == 'true' }}
        uses: actions/checkout@v6
        with:
          path: automation-src
          persist-credentials: false

      - name: Install uv
        if: ${{ steps.branch.outputs.exists == 'true' }}
        uses: astral-sh/setup-uv@v7

      # The script works on text and AST only — no cognee environment needed,
      # just the anthropic SDK in an ephemeral interpreter. Versions pinned:
      # the script uses beta API surface, and ruff must match the repo's
      # pre-commit pin so the bot never fights the formatter.
      - name: Generate descriptions
        if: ${{ steps.branch.outputs.exists == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --no-project --with 'anthropic>=0.75,<1' \
            python automation-src/tools/describe_router_params.py

      - name: Commit and push
        if: ${{ steps.branch.outputs.exists == 'true' }}
        env:
          PUSH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT_TOKEN }}
        run: |
          uvx ruff@0.15.11 format cognee/api
          git add cognee
          if git diff --cached --quiet; then
            echo "No description changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: Generate parameter descriptions with Claude (RES-14)"
          git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:automation/fix-router-docstrings
