name: Nightly Tests

# ══════════════════════════════════════════════════════════════════════════════
# TEMPORARY — EXPERIMENT BRANCH `experiment/rust-wap-llm-only`. DO NOT MERGE.
#
# Every arm except `perf-rust-wap-llm` (Rust SDK — War and Peace — real LLM) is
# removed, and so is the `notify` job — no Slack post, no MotherDuck load. The
# point is to re-measure that one arm after equalising embedding dimensions with
# the Python arm (see performance_report_rust.yml on this branch) without paying
# for, or waiting on, the other ~15 jobs.
#
# The `schedule` trigger is removed too, so this branch can never fire a nightly
# on its own; run it by hand with `workflow_dispatch` on this branch.
#
# Restore by resetting both files to `dev`.
# ══════════════════════════════════════════════════════════════════════════════

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNTIME__LOG_LEVEL: ERROR
  ENV: 'dev'

jobs:
  perf-rust-wap-llm:
    name: Performance — Rust SDK — War and Peace (real LLM)
    uses: ./.github/workflows/performance_report_rust.yml
    with:
      # 5, not the nightly's 3. Per-run spread on this arm is roughly +/-50%
      # (810s to 1193s within one job on the previous dispatch), so three
      # samples cannot separate a real shift from API latency noise. Run count
      # does not affect per-run timing, only the confidence in the percentiles.
      runs: '5'
      mode: llm
      label: war_and_peace
      memories: scripts/perf/fixtures/war_and_peace/memories.json
    secrets: inherit
