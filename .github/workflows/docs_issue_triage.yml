name: automation | Triage GitHub Docs Issues

# Hand-dispatched triage of GitHub issues that may really be docs.cognee.ai
# problems. Select one open issue by number, or every open issue created in a
# UTC date range, and run tools/docs_issue_triage.py over the selection.
#
# Phase 1: a cheap, LLM-free filter (the `documentation` label, a docs title,
# the documentation issue form, a docs.cognee.ai link, or a claim about the docs
# in the issue's problem sections) sorts issues into `pending_docs_check` or
# `skipped_*`. Skipped issues cost nothing further.
#
# Phase 2: an issue a maintainer has already replied on is left to them with no
# LLM call. For the rest, the public docs export (llms-full.txt) is fetched once
# per run and indexed lexically; each pending issue gets ONE structured LLM call
# over its top three pages. When the site already answers the report
# and `dry_run` is false, the bot leaves ONE marked comment linking the pages
# and asking the author to close; a rerun sees the marker and stays silent. Every other verdict is
# silent and only appears in the run summary. Nothing is ever closed.
#
# Phase 3 (current): `needs_source` issues are checked against the cognee
# source (git grep + one more LLM call). Issues that are uncertain, too big,
# not in the product, or already being fixed go to a human-review list that is
# emailed when the SMTP secrets from dev_previous_day_commits.yml exist.
# Confirmed small gaps feed the draft-docs matrix job below: one Claude edit
# per issue on topoteretes/cognee-docs, a draft PR via tools/manage_docs_pr.py,
# and only once that PR exists one defensive comment on the public issue. The
# comment never carries the private PR URL. `dry_run` defaults to true so a
# backlog pass can be supervised before the bot may comment or open PRs.
#
# Deliberately no `schedule` and no `on: issues` trigger. Manual runs come
# first so a human can watch the backlog in phases; automatic triggers are a
# separate decision once those runs look right.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Single open GitHub issue number (ignores since/until)
        required: false
        default: ""
        type: string
      since:
        description: UTC start date YYYY-MM-DD (issue created_at)
        required: false
        default: ""
        type: string
      until:
        description: UTC end date YYYY-MM-DD (issue created_at, inclusive)
        required: false
        default: ""
        type: string
      dry_run:
        description: No comments and no docs PRs; still runs the docs check and writes the summary
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

# Queue rather than cancel: a run cancelled between the docs push and the PR
# update would leave a draft PR half-refreshed.
concurrency:
  group: docs-issue-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      has_gaps: ${{ steps.run.outputs.has_gaps }}
      matrix: ${{ steps.run.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Install workflow dependencies
        run: uv sync --locked

      # The CLI exits 2 before any GitHub request when neither selector is
      # given, so an empty dispatch fails here and the artifact step is skipped.
      # workflow_dispatch booleans arrive as the strings "true"/"false".
      # LLM settings mirror dev_previous_day_commits.yml; the key is only
      # required when at least one selected issue passes the cheap filter.
      # The checkout above is also what the source check git-greps.
      - name: Triage selected issues
        id: run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.LLM_API_KEY }}
          LLM_ARGS: ${{ secrets.LLM_ARGS }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL || 'openai/gpt-4o-mini' }}
          # Human-review email; same secrets as the notify-failure job of
          # dev_previous_day_commits.yml. Missing values skip the email, not the run.
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.MILENKO_SMTP_USERNAME || vars.DEV_PREVIOUS_DAY_COMMITS_NOTIFICATION_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.MILENKO_SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS || 'true' }}
          NOTIFICATION_EMAIL_SENDER: ${{ secrets.NOTIFICATION_EMAIL_SENDER }}
          NOTIFICATION_EMAIL_RECEIVER: ${{ secrets.NOTIFICATION_EMAIL_RECEIVER }}
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          INPUT_SINCE: ${{ github.event.inputs.since }}
          INPUT_UNTIL: ${{ github.event.inputs.until }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          args=(
            --repo "${{ github.repository }}"
            --issue-number "${INPUT_ISSUE_NUMBER}"
            --since "${INPUT_SINCE}"
            --until "${INPUT_UNTIL}"
            --results-json triage-results.json
          )
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi

          uv run python tools/docs_issue_triage.py "${args[@]}"

      # `always()` rather than `success()`: a failed LLM call marks its row
      # `uncertain` and exits 1 after writing the results, which are still worth
      # keeping. A missing-selector failure exits before the file exists, and
      # `if-no-files-found: ignore` keeps that from turning into a second error.
      - name: Upload triage results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: triage-results
          path: triage-results.json
          if-no-files-found: ignore

  # One matrix job per confirmed small gap, never on a dry run. Mirrors the
  # create-docs-prs job of dev_previous_day_commits.yml: docs repo checkout with
  # the PAT, a branch per issue, one Claude edit, tools/manage_docs_pr.py, and
  # the public comment only when a PR number came back. Runs one at a time so
  # two issues never race on the docs repo. No uv here: everything this job runs
  # from tools/ is stdlib-only.
  draft-docs:
    needs: triage
    if: ${{ github.event.inputs.dry_run != 'true' && needs.triage.outputs.has_gaps == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.triage.outputs.matrix) }}

    steps:
      - name: Check out core repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Check out docs repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          repository: topoteretes/cognee-docs
          token: ${{ secrets.REPO_DISPATCH_PAT_TOKEN }}
          ref: main
          path: docs-repo

      - name: Write the issue excerpt
        env:
          BODY_B64: ${{ matrix.body_b64 }}
        run: python3 -c "import base64, os, pathlib; pathlib.Path('issue_excerpt.md').write_bytes(base64.b64decode(os.environ['BODY_B64']))"

      # The source check names docs files from grep hits and page text; drop any
      # that do not exist in the docs repo. With none left there is nothing to
      # edit, so this matrix item ends here without a comment.
      - name: Resolve docs files
        id: docs_files
        env:
          DOCS_FILES: ${{ matrix.docs_files }}
        run: |
          set -euo pipefail
          existing=""
          for path in ${DOCS_FILES}; do
            if [ -f "docs-repo/${path}" ]; then
              existing="${existing} ${path}"
            else
              echo "skipping ${path}: not in docs-repo"
            fi
          done
          existing="${existing# }"
          echo "existing=${existing}" >> "$GITHUB_OUTPUT"
          if [ -z "${existing}" ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Docs draft for #${{ matrix.number }}: skipped"
              echo
              echo "None of the docs files named by the source check exist in cognee-docs: \`${DOCS_FILES}\`."
              echo "No edit, no PR, no comment. Listed for human review."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare docs branch
        if: ${{ steps.docs_files.outputs.has_files == 'true' }}
        working-directory: docs-repo
        run: |
          BRANCH="automation/docs-issue-${{ matrix.number }}"
          git fetch origin "${BRANCH}" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            git checkout -B "${BRANCH}"
          fi

      - name: Edit docs with Claude
        if: ${{ steps.docs_files.outputs.has_files == 'true' }}
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678  # v1.0.201
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read and follow `.github/prompts/docs_issue_edit.md`.

            - GitHub issue: https://github.com/${{ github.repository }}/issues/${{ matrix.number }}
            - Title: ${{ matrix.title }}
            - Issue excerpt file: ./issue_excerpt.md
            - Source files (repo root): ${{ matrix.source_files }}
            - Docs files (under ./docs-repo): ${{ steps.docs_files.outputs.existing }}
          claude_args: "--allowed-tools Read,Edit,Write,Glob,Grep --max-turns 40"

      # Same guard as the sibling workflow: the action fails a step whose turn
      # count overshoots even when the agent finished cleanly, so judge from the
      # agent's own result and keep completed work.
      - name: Check the editing agent finished
        if: ${{ steps.docs_files.outputs.has_files == 'true' }}
        env:
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ "${CLAUDE_CONCLUSION:-}" != "success" ]; then
            if [ -z "${EXECUTION_FILE:-}" ] || [ ! -s "${EXECUTION_FILE}" ] || \
               ! jq -e '[.. | objects | select(has("is_error"))] | last | .is_error == false' \
                    "${EXECUTION_FILE}" >/dev/null 2>&1; then
              echo "The editing agent did not finish (conclusion=${CLAUDE_CONCLUSION:-unknown})."
              exit 1
            fi
            echo "The action failed on the turn count but the agent finished cleanly - keeping the work."
          fi

      - name: Commit docs draft
        if: ${{ steps.docs_files.outputs.has_files == 'true' }}
        id: commit_docs
        working-directory: docs-repo
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changes_made=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Docs draft for #${{ matrix.number }}: no changes"
              echo
              echo "Claude made no edit to the listed docs files, so there is no PR and no comment."
              echo "Listed for human review."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "docs: draft from GitHub issue #${{ matrix.number }}"
          echo "changes_made=true" >> "$GITHUB_OUTPUT"

      - name: Push docs draft branch
        if: ${{ steps.commit_docs.outputs.changes_made == 'true' }}
        working-directory: docs-repo
        run: git push --force-with-lease origin "automation/docs-issue-${{ matrix.number }}"

      - name: Create or update docs pull request
        if: ${{ steps.commit_docs.outputs.changes_made == 'true' }}
        id: manage_pr
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_PAT_TOKEN }}
          PR_TITLE: "docs: draft from GitHub issue #${{ matrix.number }}"
          PR_BODY: |
            ## Summary

            Automated documentation draft for the public GitHub issue
            https://github.com/${{ github.repository }}/issues/${{ matrix.number }}
            (${{ matrix.title }}).

            The docs-issue triage found that the cognee source has the behaviour the
            issue describes and the docs miss a small fact. Review the edit against the
            source files below before merging; the issue was told only that a docs change
            *may* be prepared.

            - Source files: `${{ matrix.source_files }}`
            - Docs files: `${{ steps.docs_files.outputs.existing }}`

            Follow-up (out of scope): cognee repo Markdown, CLAUDE.md, and Python docstrings.
        run: |
          python3 tools/manage_docs_pr.py \
            --target-repo topoteretes/cognee-docs \
            --head-branch "automation/docs-issue-${{ matrix.number }}" \
            --pr-title "${PR_TITLE}" \
            --pr-body "${PR_BODY}" \
            --changes-made true

      # GITHUB_TOKEN, not the PAT: the comment goes on this repository's issue.
      # The step runs only when manage_docs_pr.py returned a PR number, so the
      # bot never thanks a reporter for a change that does not exist.
      - name: Comment on the public issue
        if: ${{ steps.manage_pr.outputs.pr_number != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/docs_issue_triage.py --repo "${{ github.repository }}" --post-gap-comment "${{ matrix.number }}"

      - name: Summarize
        if: ${{ steps.commit_docs.outputs.changes_made == 'true' }}
        run: |
          {
            echo "## Docs draft for #${{ matrix.number }}"
            echo
            echo "- Docs branch: \`automation/docs-issue-${{ matrix.number }}\`"
            echo "- Docs files: \`${{ steps.docs_files.outputs.existing }}\`"
            if [ -n "${{ steps.manage_pr.outputs.pr_url }}" ]; then
              echo "- Pull request: ${{ steps.manage_pr.outputs.pr_url }}"
              echo "- Public comment: posted (defensive wording, no PR link)"
            else
              echo "- Pull request: not created; no public comment"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
