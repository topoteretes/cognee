# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^deployment/helm/templates/
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.6
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [python, pyi]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      # .agents/skills/ is Codex's copy of .claude/skills/; never edit it by hand.
      - id: sync-agent-skills
        name: Sync .agents/skills from .claude/skills
        entry: python scripts/sync_agent_skills.py
        language: python
        pass_filenames: false
        files: ^\.(claude|agents)/skills/
