# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# gliner2 inference code copied by vendor_gliner2.py stays byte-identical to upstream.
exclude: ^cognee/tasks/graph/gliner_demo/onnx/_gliner2/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^deployment/helm/templates/
      - id: check-added-large-files
        # The GLiNER ONNX graphs are package data by design (~0.9 MB each, weights
        # excluded); regenerated by cognee/tasks/graph/gliner_demo/onnx/export.py.
        exclude: ^cognee/tasks/graph/gliner_demo/onnx/graphs/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.6
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [python, pyi]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]
